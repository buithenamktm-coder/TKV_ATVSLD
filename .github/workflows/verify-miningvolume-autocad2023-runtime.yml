name: Verify MiningVolume AutoCAD 2023 Runtime

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag or commit to verify
        required: true
        default: miningvolume-v0.10.4-tin-core
  issue_comment:
    types: [created]

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.comment.body == '/runtime-autocad2023')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: read
    outputs:
      source_ref: ${{ steps.source.outputs.result }}

    steps:
      - name: Resolve exact source revision
        id: source
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            if (context.eventName === 'workflow_dispatch') {
              return context.payload.inputs.source_ref;
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            return pr.head.sha;

      - name: Cancel stale runtime runs
        uses: actions/github-script@v7
        with:
          script: |
            const workflowId = 'verify-miningvolume-autocad2023-runtime.yml';
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowId,
              per_page: 100
            });
            const stale = data.workflow_runs.filter(run =>
              run.id !== context.runId &&
              (run.status === 'queued' || run.status === 'in_progress')
            );
            core.info(`Stale runtime runs to cancel: ${stale.length}`);
            for (const run of stale) {
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });
                core.info(`Cancelled runtime run ${run.id}`);
              } catch (error) {
                core.warning(`Could not cancel runtime run ${run.id}: ${error.message}`);
              }
            }

      - name: Record requested source
        shell: bash
        run: |
          echo "Runtime source requested: ${{ steps.source.outputs.result }}"

  runtime:
    needs: prepare
    runs-on: [self-hosted, Windows, X64, autocad2023]
    timeout-minutes: 20
    permissions:
      contents: read

    env:
      MV_ROOT: tools/MiningVolume_HSNext/v0.9
      REQUESTED_SOURCE_REF: ${{ needs.prepare.outputs.source_ref }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REQUESTED_SOURCE_REF }}

      - name: Record exact source commit
        shell: powershell
        run: |
          $sha = (git rev-parse HEAD).Trim()
          "SOURCE_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Runtime source commit: $sha"
          Write-Host "Requested source: $env:REQUESTED_SOURCE_REF"

      - name: Resolve AutoCAD 2023 installation
        shell: powershell
        run: |
          if (Get-Process acad -ErrorAction SilentlyContinue) {
            throw 'Hãy đóng AutoCAD trước khi chạy runtime gate.'
          }

          $candidates = @(
            (Join-Path $env:ProgramFiles 'Autodesk\AutoCAD 2023'),
            'C:\Program Files\Autodesk\AutoCAD 2023'
          ) | Select-Object -Unique

          $cadDir = $null
          foreach ($dir in $candidates) {
            if ($dir -and (Test-Path (Join-Path $dir 'acad.exe')) -and (Test-Path (Join-Path $dir 'AcMgd.dll'))) {
              $cadDir = $dir
              break
            }
          }

          if (-not $cadDir) {
            foreach ($root in @(
              'HKLM:\SOFTWARE\Autodesk\AutoCAD\R24.2',
              'HKLM:\SOFTWARE\WOW6432Node\Autodesk\AutoCAD\R24.2'
            )) {
              if (-not (Test-Path $root)) { continue }
              foreach ($key in Get-ChildItem $root -ErrorAction SilentlyContinue) {
                try {
                  $candidate = (Get-ItemProperty $key.PSPath -ErrorAction Stop).AcadLocation
                  if ($candidate -and (Test-Path (Join-Path $candidate 'acad.exe')) -and
                      (Test-Path (Join-Path $candidate 'AcMgd.dll'))) {
                    $cadDir = $candidate
                    break
                  }
                } catch { }
              }
              if ($cadDir) { break }
            }
          }

          if (-not $cadDir) {
            throw 'Không tìm thấy AutoCAD 2023 R24.2 trên runtime runner.'
          }

          $acad = Join-Path $cadDir 'acad.exe'
          $version = (Get-Item $acad).VersionInfo.FileVersion
          if ($version -notmatch '^24\.2') {
            throw "acad.exe không phải AutoCAD 2023 R24.2. FileVersion=$version"
          }

          "AUTOCAD2023_DIR=$cadDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "AutoCAD 2023: $acad"
          Write-Host "FileVersion: $version"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Restore with real AutoCAD 2023 references
        shell: powershell
        run: |
          Set-Location $env:MV_ROOT
          dotnet restore MiningVolume.HSNext.sln -p:UseAutoCADNuGet=false

      - name: Build against installed AutoCAD 2023
        shell: powershell
        run: |
          Set-Location $env:MV_ROOT
          dotnet build MiningVolume.HSNext.sln -c Release --no-restore -p:UseAutoCADNuGet=false -p:AutoCAD2023Dir="$env:AUTOCAD2023_DIR"

      - name: Assemble runtime bundle
        shell: powershell
        run: |
          Set-Location $env:MV_ROOT
          $out = 'bundle/MiningVolume2023.bundle/Contents/Windows'
          New-Item -ItemType Directory -Force $out | Out-Null
          Remove-Item "$out/*" -Force -ErrorAction SilentlyContinue
          Copy-Item 'src/MiningVolume.Plugin2023/bin/Release/net48/MiningVolume2023.dll' $out
          Copy-Item 'src/MiningVolume.Core/bin/Release/net48/MiningVolume.Core.dll' $out
          Copy-Item 'src/MiningVolume.Surface/bin/Release/net48/MiningVolume.Surface.dll' $out
          Copy-Item 'src/MiningVolume.Cad2023/bin/Release/net48/MiningVolume.Cad2023.dll' $out
          ./release/verify_release.ps1

      - name: Run MVSELFTEST in AutoCAD 2023
        shell: powershell
        run: |
          Set-Location $env:MV_ROOT
          ./release/verify_autocad2023_runtime.ps1

      - name: Build runtime-validated installer
        shell: powershell
        run: |
          Set-Location $env:MV_ROOT
          if (-not (Test-Path 'dist/RUNTIME_VERIFICATION.txt')) {
            throw 'Thiếu RUNTIME_VERIFICATION.txt sau MVSELFTEST.'
          }
          $runtimeProof = Get-Content 'dist/RUNTIME_VERIFICATION.txt' -Raw
          if ($runtimeProof -notmatch 'Status=PASS') {
            throw 'Không được tạo Setup FINAL khi runtime verification chưa PASS.'
          }

          Remove-Item installer/payload.zip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path bundle -DestinationPath installer/payload.zip -CompressionLevel Optimal

          Set-Location installer
          $env:GOOS='windows'
          $env:GOARCH='amd64'
          $env:CGO_ENABLED='0'
          go vet main.go
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o ../dist/MiningVolume_HSNext_AutoCAD2023_Setup_v0.10.4_RUNTIME_PASS.exe main.go
          Set-Location ..

          $setup = 'dist/MiningVolume_HSNext_AutoCAD2023_Setup_v0.10.4_RUNTIME_PASS.exe'
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            'MiningVolume HS-Next v0.10.4 - RUNTIME-PASS RELEASE VERIFICATION'
            ('Timestamp=' + (Get-Date).ToString('o'))
            'Status=PASS'
            ('SourceCommit=' + $env:SOURCE_SHA)
            ('RuntimeWorkflowRun=' + $env:GITHUB_RUN_ID)
            'AutoCAD2023Runtime=PASS'
            'MVSELFTEST=PASS'
            ('SetupSHA256=' + $hash)
          ) | Set-Content -Encoding utf8 dist/RUNTIME_RELEASE_VERIFICATION.txt
          "SHA256  $hash  $(Split-Path $setup -Leaf)" | Set-Content -Encoding ascii dist/RUNTIME_RELEASE_SHA256.txt
          Get-Content dist/RUNTIME_RELEASE_VERIFICATION.txt

      - name: Capture startup log
        if: always()
        shell: powershell
        run: |
          $p = Join-Path $env:ProgramData 'MiningVolume2023\Logs\startup.log'
          if (Test-Path $p) {
            New-Item -ItemType Directory -Force "$env:MV_ROOT/dist" | Out-Null
            Copy-Item $p "$env:MV_ROOT/dist/startup_runtime.log" -Force
          }

      - name: Upload runtime-passed release
        uses: actions/upload-artifact@v4
        with:
          name: MiningVolume-HSNext-AutoCAD2023-v0.10.4-RUNTIME-PASS
          if-no-files-found: error
          path: |
            tools/MiningVolume_HSNext/v0.9/dist/MiningVolume_HSNext_AutoCAD2023_Setup_v0.10.4_RUNTIME_PASS.exe
            tools/MiningVolume_HSNext/v0.9/dist/RUNTIME_RELEASE_VERIFICATION.txt
            tools/MiningVolume_HSNext/v0.9/dist/RUNTIME_RELEASE_SHA256.txt
            tools/MiningVolume_HSNext/v0.9/dist/RUNTIME_VERIFICATION.txt
            tools/MiningVolume_HSNext/v0.9/dist/MVSELFTEST_RUNTIME.txt
            tools/MiningVolume_HSNext/v0.9/dist/startup_runtime.log
            tools/MiningVolume_HSNext/v0.9/bundle/MiningVolume2023.bundle/**

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MiningVolume-AutoCAD2023-Runtime-Diagnostics-v0.10.4
          if-no-files-found: warn
          path: |
            tools/MiningVolume_HSNext/v0.9/dist/RUNTIME_VERIFICATION.txt
            tools/MiningVolume_HSNext/v0.9/dist/MVSELFTEST_RUNTIME.txt
            tools/MiningVolume_HSNext/v0.9/dist/startup_runtime.log
