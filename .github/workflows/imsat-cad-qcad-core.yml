name: IMSAT CAD Native QCAD Core Feasibility (GPLv3)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/imsat-cad-qcad-core.yml"
      - "tools/IMSAT_CAD_V1/qcad_addon/**"
  push:
    branches: [imsat-cad-foundation]
    paths:
      - ".github/workflows/imsat-cad-qcad-core.yml"
      - "tools/IMSAT_CAD_V1/qcad_addon/**"
concurrency:
  group: imsat-cad-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-cad-core:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Fast static add-on preflight
        shell: pwsh
        run: |
          node --check tools/IMSAT_CAD_V1/qcad_addon/IMSATCAD/IMSATCAD.js
          node tools/IMSAT_CAD_V1/qcad_addon/check-addon.js
          node tools/IMSAT_CAD_V1/qcad_addon/test-addon-runtime.js
      - name: Install Qt 6 for MSVC
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.5.3"
          arch: win64_msvc2019_64
          modules: "qt5compat qtpositioning qtlocation"
          cache: true
      - name: Initialize MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
      - name: Fetch version-matched upstream CAD engine
        shell: pwsh
        run: |
          git clone --depth 1 --branch v3.32.2.0 https://github.com/qcad/qcad.git native/qcad
          git clone --depth 1 --branch v3.32.2.0 https://github.com/qcad/qtjsapi.git native/qtjsapi
          git clone --depth 1 --branch v3.32.2.0 https://github.com/qcad/qcadjsapi.git native/qcadjsapi
          git -C native/qcad rev-parse HEAD | Out-File -Append native-commit-report.txt
          git -C native/qtjsapi rev-parse HEAD | Out-File -Append native-commit-report.txt
          git -C native/qcadjsapi rev-parse HEAD | Out-File -Append native-commit-report.txt
      - name: Validate and install IMSAT CAD command aliases
        shell: pwsh
        run: |
          Copy-Item -Recurse tools/IMSAT_CAD_V1/qcad_addon/IMSATCAD native/qcad/scripts/IMSATCAD
      - name: Validate IMSAT aliases against pinned QCAD script tree
        shell: pwsh
        run: |
          $addon = Get-Content "tools/IMSAT_CAD_V1/qcad_addon/IMSATCAD/IMSATCAD.js" -Raw
          $matches = [regex]::Matches($addon, '\["(scripts/[^"]+\.js)",\s*\[')
          if ($matches.Count -lt 10) { throw "Too few IMSAT CAD command mappings found" }
          $missing = @()
          foreach ($match in $matches) {
            $script = $match.Groups[1].Value
            if (-not (Test-Path (Join-Path "native/qcad" $script))) {
              $missing += $script
            }
          }
          if ($missing.Count -gt 0) {
            throw ("IMSAT CAD aliases refer to missing upstream actions: " + ($missing -join ", "))
          }
          Write-Host "IMSAT CAD alias script existence PASS: $($matches.Count) mappings"
      - name: Validate native IMSAT toolbar action paths
        shell: pwsh
        run: |
          $addon = Get-Content "tools/IMSAT_CAD_V1/qcad_addon/IMSATCAD/IMSATCAD.js" -Raw
          $sections = @("_drawScripts", "_modifyScripts", "_annotationScripts", "_layerScripts", "_utilityScripts", "_blockScripts", "_selectionScripts", "_fileScripts")
          $missing = @()
          $total = 0
          foreach ($section in $sections) {
            $pattern = '(?s)IMSATCAD\.' + [regex]::Escape($section) + '\s*=\s*\[(.*?)\];'
            $match = [regex]::Match($addon, $pattern)
            if (-not $match.Success) { throw "Missing toolbar section: $section" }
            $paths = [regex]::Matches($match.Groups[1].Value, '"(scripts/[^"]+\.js)"')
            if ($paths.Count -eq 0) { throw "No actions configured in $section" }
            foreach ($item in $paths) {
              $total++
              $script = $item.Groups[1].Value
              if (-not (Test-Path (Join-Path "native/qcad" $script))) { $missing += "$section : $script" }
            }
          }
          if ($missing.Count -gt 0) { throw ("Missing native toolbar scripts: " + ($missing -join "; ")) }
          Write-Host "IMSAT CAD native toolbar source paths PASS: $total actions"

      - name: Fix vendored zlib linkage for MSVC
        shell: pwsh
        run: |
          # Upstream v3.32.2.0 uses a shared zlib without dllexport annotations.
          # MSVC can build zlib.dll but produce no import .lib, causing LNK1181.
          # Build vendored zlib AND OpenNURBS as static dependencies; drop GNU
          # "-L/path" flags that MSVC interprets as invalid /L switches.
          $zlib = "native/qcad/src/3rdparty/opennurbs/zlib/CMakeLists.txt"
          $zc = [IO.File]::ReadAllText($zlib)
          if (-not $zc.Contains("add_library(zlib SHARED")) { throw "Unexpected pinned QCAD zlib CMake contents" }
          $zc = $zc.Replace("add_library(zlib SHARED", "add_library(zlib STATIC")
          $zc = ($zc -split "`r?`n" | Where-Object { $_ -notmatch '^\s*target_link_libraries\(zlib PUBLIC -L' }) -join "`n"
          [IO.File]::WriteAllText($zlib, $zc)
          $on = "native/qcad/src/3rdparty/opennurbs/opennurbs/CMakeLists.txt"
          $oc = [IO.File]::ReadAllText($on)
          if (-not $oc.Contains("add_library(opennurbs SHARED")) { throw "Unexpected pinned OpenNURBS CMake contents" }
          $oc = $oc.Replace("add_library(opennurbs SHARED", "add_library(opennurbs STATIC")
          $oc = ($oc -split "`r?`n" | Where-Object { $_ -notmatch '^\s*target_link_libraries\(opennurbs PUBLIC -L' }) -join "`n"
          [IO.File]::WriteAllText($on, $oc)
          $parent = "native/qcad/src/3rdparty/opennurbs/CMakeLists.txt"
          $cmakeRoot = (Resolve-Path "native/qcad").Path.Replace([char]92, "/")
          $release = "$cmakeRoot/release"
          $cmake = 'set_target_properties(zlib opennurbs PROPERTIES ARCHIVE_OUTPUT_DIRECTORY "{0}" LIBRARY_OUTPUT_DIRECTORY "{0}" RUNTIME_OUTPUT_DIRECTORY "{0}")' -f $release
          Add-Content -Path $parent -Value $cmake
      - name: Work around MSVC OpenNURBS optimizer ICE (C1001)
        shell: pwsh
        run: |
          $cm = 'native/qcad/src/3rdparty/opennurbs/CMakeLists.txt'
          Add-Content -Path $cm -Value ''
          Add-Content -Path $cm -Value '# IMSAT CI-only workaround: MSVC /O2 ICE in opennurbs_lookup.cpp'
          Add-Content -Path $cm -Value 'if(MSVC)'
          Add-Content -Path $cm -Value '  set_source_files_properties(opennurbs_lookup.cpp PROPERTIES COMPILE_OPTIONS "/Od")'
          Add-Content -Path $cm -Value 'endif()'
      - name: Build QCAD core
        shell: pwsh
        run: |
          cmake -S native/qcad -B native/qcad -G Ninja -DBUILD_QT6=ON -DCMAKE_BUILD_TYPE=Release "-DCMAKE_CXX_FLAGS_RELEASE=/Od /DNDEBUG /MD" "-DCMAKE_C_FLAGS_RELEASE=/Od /DNDEBUG /MD"
          cmake --build native/qcad --parallel 4
      - name: Build Qt JavaScript integration
        shell: pwsh
        run: |
          cmake -S native/qtjsapi -B native/qtjsapi -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build native/qtjsapi --parallel 4
      - name: Build QCAD JavaScript API
        shell: pwsh
        run: |
          cmake -S native/qcadjsapi -B native/qcadjsapi -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build native/qcadjsapi --parallel 4
      - name: Verify native CAD executable and plugins
        shell: pwsh
        run: |
          $exe = Get-ChildItem native/qcad/release -File -Filter "qcad*.exe" | Select-Object -First 1
          if ($null -eq $exe) { throw "No native QCAD executable was produced" }
          $js = Get-ChildItem native/qcad/plugins -File -Filter "*qcadjsapi*.dll" | Select-Object -First 1
          if ($null -eq $js) { throw "Missing JavaScript CAD API plugin" }
          Write-Host "Native CAD executable: $($exe.FullName)"
          Write-Host "CAD JavaScript API: $($js.FullName)"
      - name: Inspect JavaScript plugin dependencies
        shell: pwsh
        run: |
          $plugin = Get-ChildItem "native/qcad/plugins" -Filter "*qcadjsapi*.dll" -File | Select-Object -First 1
          if (-not $plugin) { throw "QCAD JavaScript plugin missing" }
          & dumpbin.exe /DEPENDENTS $plugin.FullName | Out-File "native-plugin-dependencies.txt"
          if ($LASTEXITCODE -ne 0) { throw "Plugin dependency inspection failed" }
          $qtBinDir = Split-Path (Get-Command windeployqt.exe -ErrorAction Stop).Source -Parent
          $names = [regex]::Matches((Get-Content "native-plugin-dependencies.txt" -Raw), '(?im)^\s*(Qt6[A-Za-z0-9_]+\.dll)\s*$') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          foreach ($name in $names) {
            $source = Join-Path $qtBinDir $name
            if (-not (Test-Path $source)) { throw "Plugin Qt dependency unavailable: $name" }
            Copy-Item $source (Join-Path "native/qcad/release" $name) -Force
          }
      - name: Verify Windows loader dependencies for native QCAD
        shell: pwsh
        run: |
          $exe = Get-ChildItem native/qcad/release -File -Filter "qcad*.exe" | Select-Object -First 1
          if (-not $exe) { throw "Native QCAD executable missing" }
          $qtBin = (Get-Command windeployqt.exe -ErrorAction Stop).Source
          & $qtBin --dry-run --list mapping $exe.FullName | Out-File native-qt-dependencies.txt
          if ($LASTEXITCODE -ne 0) { throw "Qt deployment dependency inspection failed" }
          if (-not (Test-Path native-qt-dependencies.txt)) { throw "Dependency manifest missing" }
          Write-Host "Qt runtime dependency manifest generated"
      - name: Deploy Qt runtime alongside native CAD executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem native/qcad/release -File -Filter "qcad*.exe" | Select-Object -First 1
          if (-not $exe) { throw "Native QCAD executable missing" }
          $qtBin = (Get-Command windeployqt.exe -ErrorAction Stop).Source
          & $qtBin --release --compiler-runtime $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }
          $platforms = Join-Path $exe.DirectoryName "platforms/qwindows.dll"
          if (-not (Test-Path $platforms)) { throw "Qt Windows platform plugin missing" }
          # windeployqt scans the executable, but QCAD loads additional Qt
          # modules indirectly through its CAD/JavaScript plugins.
          $qtBinDir = Split-Path $qtBin -Parent
          $runtime = @("Qt6Concurrent.dll", "Qt6PrintSupport.dll", "Qt6Qml.dll")
          foreach ($dll in $runtime) {
            $source = Join-Path $qtBinDir $dll
            if (-not (Test-Path $source)) { throw "Qt runtime unavailable: $source" }
            Copy-Item $source (Join-Path $exe.DirectoryName $dll) -Force
          }
          # qcadjsapi loads Qt modules dynamically; windeployqt(qcad.exe)
          # alone does not discover plugin-only and transitive Qt dependencies.
          $qtModules = Get-ChildItem $qtBinDir -File -Filter "Qt6*.dll"
          if ($qtModules.Count -lt 15) { throw "Qt deployment directory appears incomplete" }
          foreach ($module in $qtModules) {
            Copy-Item $module.FullName (Join-Path $exe.DirectoryName $module.Name) -Force
          }
          Write-Host "Bundled $($qtModules.Count) Qt6 runtime DLLs for dynamically loaded CAD plugins"
          Write-Host "Native CAD Qt runtime deployed: $($exe.DirectoryName)"
      - name: Verify packaged native CAD dependencies
        shell: pwsh
        run: |
          $release = "native/qcad/release"
          $exe = Get-ChildItem $release -File -Filter "qcad*.exe" | Select-Object -First 1
          if (-not $exe) { throw "Native QCAD executable missing" }
          foreach ($dll in @("Qt6Core.dll", "Qt6Gui.dll", "Qt6Widgets.dll", "Qt6Concurrent.dll", "Qt6PrintSupport.dll", "Qt6Qml.dll")) {
            if (-not (Test-Path (Join-Path $release $dll))) { throw "Missing packaged dependency: $dll" }
          }
          if (-not (Test-Path (Join-Path $release "platforms/qwindows.dll"))) {
            throw "Missing Windows platform plugin"
          }
          Write-Host "Native CAD deployment dependency gate PASS (not a GUI runtime test)"
      - name: Check native CAD executable starts in headless mode
        shell: pwsh
        run: |
          $exe = Get-ChildItem "native/qcad/release" -File -Filter "qcad*.exe" | Select-Object -First 1
          if (-not $exe) { throw "Native CAD executable missing" }
          $stdout = Join-Path $env:RUNNER_TEMP "imsat-cad-smoke-stdout.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "imsat-cad-smoke-stderr.txt"
          $proc = Start-Process -FilePath $exe.FullName -ArgumentList @("-no-gui", "-help") -WorkingDirectory $exe.DirectoryName -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          if (-not $proc.WaitForExit(45000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "Native CAD headless startup timed out"
          }
          $proc.Refresh()
          Get-Content $stdout -ErrorAction SilentlyContinue | Select-Object -First 40
          Get-Content $stderr -ErrorAction SilentlyContinue | Select-Object -First 40
          if ($proc.ExitCode -ne 0) { throw "Native CAD headless startup failed with exit code $($proc.ExitCode)" }
          "ExitCode=$($proc.ExitCode)" | Set-Content "native-headless-smoke.txt"
          "Executable=$($exe.Name)" | Add-Content "native-headless-smoke.txt"
          "Arguments=-no-gui -help" | Add-Content "native-headless-smoke.txt"
          Get-Content $stdout -ErrorAction SilentlyContinue | Select-Object -First 80 | Add-Content "native-headless-smoke.txt"
          Get-Content $stderr -ErrorAction SilentlyContinue | Select-Object -First 80 | Add-Content "native-headless-smoke.txt"
          Write-Host "Native CAD headless startup PASS (GUI interaction not validated)"
      - name: Stage native CAD application with scripts and plugins
        shell: pwsh
        run: |
          $stage = "native-cad-stage"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "native/qcad/release/*" $stage -Recurse -Force
          New-Item -ItemType Directory -Force "$stage/scripts", "$stage/plugins" | Out-Null
          Copy-Item "native/qcad/scripts/*" "$stage/scripts" -Recurse -Force
          Copy-Item "native/qcad/plugins/*" "$stage/plugins" -Recurse -Force
          New-Item -ItemType Directory -Force "$stage/licenses" | Out-Null
          Copy-Item "native/qcad/LICENSE.txt" "$stage/licenses/QCAD-LICENSE.txt" -Force
          @"
          IMSAT CAD native prototype - QCAD Community Edition v3.32.2.0
          Based on QCAD, licensed under GNU GPL version 3.
          QCAD upstream source: https://github.com/qcad/qcad/tree/v3.32.2.0
          Qt JavaScript API source: https://github.com/qcad/qtjsapi/tree/v3.32.2.0
          QCAD JavaScript API source: https://github.com/qcad/qcadjsapi/tree/v3.32.2.0
          IMSAT integration source: https://github.com/buithenamktm-coder/TKV_ATVSLD
          This is a development build, NOT a tested release.
          "@ | Set-Content "$stage/licenses/SOURCE_AND_STATUS.txt" -Encoding UTF8
          if (-not (Test-Path "$stage/licenses/QCAD-LICENSE.txt")) {
            throw "Native package is missing upstream QCAD license"
          }
          if (-not (Test-Path "$stage/scripts/IMSATCAD/IMSATCAD.js")) {
            throw "IMSAT CAD add-on missing from native package"
          }
          if (-not (Get-ChildItem "$stage/plugins" -Filter "*qcadjsapi*.dll" -File)) {
            throw "QCAD JavaScript API missing from native package"
          }
          if (-not (Get-ChildItem $stage -Filter "qcad*.exe" -File)) {
            throw "QCAD executable missing from native package"
          }
          $required = @(
            "scripts/IMSATCAD/IMSATCAD.js",
            "licenses/QCAD-LICENSE.txt",
            "licenses/SOURCE_AND_STATUS.txt",
            "platforms/qwindows.dll",
            "Qt6Concurrent.dll",
            "Qt6PrintSupport.dll",
            "Qt6Qml.dll"
          )
          foreach ($item in $required) {
            if (-not (Test-Path (Join-Path $stage $item))) { throw "Native package missing: $item" }
          }
          Get-ChildItem $stage -Recurse -File |
            ForEach-Object {
              [pscustomobject]@{
                Path = $_.FullName.Substring((Resolve-Path $stage).Path.Length + 1).Replace([char]92, "/")
                Size = $_.Length
                SHA256 = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash
              }
            } | Sort-Object Path | Export-Csv "native-package-manifest.csv" -NoTypeInformation -Encoding UTF8
          if (-not (Test-Path "native-package-manifest.csv")) { throw "Native package manifest missing" }
          Compress-Archive -Path "$stage/*" -DestinationPath "imsat-cad-native-windows-build.zip" -Force
          if (-not (Test-Path "imsat-cad-native-windows-build.zip")) {
            throw "Native CAD ZIP staging failed"
          }
          Write-Host "Native CAD staged with IMSAT scripts (runtime not yet validated)"
      - name: Stage IMSAT CAD brand icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow
          if ($LASTEXITCODE -ne 0) { throw "Pillow installation failed" }
          python tools/IMSAT_CAD_V1/generate-brand.py
          if ($LASTEXITCODE -ne 0) { throw "Brand icon generation failed" }
          $icon = "tools/IMSAT_CAD_V1/assets/imsatcad.ico"
          if (-not (Test-Path $icon)) { throw "IMSAT icon missing" }
          New-Item -ItemType Directory -Force "native-cad-stage/branding" | Out-Null
          Copy-Item $icon "native-cad-stage/branding/imsatcad.ico" -Force
      - name: Build experimental native Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler missing" }
          if (-not (Test-Path "native-cad-stage/qcad.exe")) { throw "Native CAD entry executable missing" }
          Copy-Item "native-cad-stage/qcad.exe" "native-cad-stage/IMSATCAD.exe" -Force
          Copy-Item "tools/IMSAT_CAD_V1/imsatcad-native-v1.iss" "imsatcad-native-build.iss" -Force
          & $compiler "imsatcad-native-build.iss"
          if ($LASTEXITCODE -ne 0) { throw "Native Inno Setup compilation failed" }
          if (-not (Test-Path "IMSAT-CAD-V1.0-Setup.exe")) {
            throw "Native Windows setup was not generated"
          }
          Get-FileHash "IMSAT-CAD-V1.0-Setup.exe" -Algorithm SHA256 |
            Format-List | Out-String | Set-Content "native-installer-sha256.txt"
          Write-Host "Native development installer compiled; installation and GUI not yet tested"
      - name: Smoke test native installer and uninstaller
        shell: pwsh
        run: |
          $setup = (Resolve-Path "IMSAT-CAD-V1.0-Setup.exe").Path
          $destination = Join-Path $env:RUNNER_TEMP "IMSAT-CAD-Native-Install-Smoke"
          $install = Start-Process -FilePath $setup -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$destination") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Native installer exited with $($install.ExitCode)" }
          foreach ($relative in @("IMSATCAD.exe", "scripts/IMSATCAD/IMSATCAD.js", "licenses/QCAD-LICENSE.txt", "platforms/qwindows.dll", "Qt6Concurrent.dll", "Qt6PrintSupport.dll", "Qt6Qml.dll")) {
            if (-not (Test-Path (Join-Path $destination $relative))) { throw "Installed native CAD missing: $relative" }
          }
          # Launch installed binary from its installation directory rather
          # than the build tree; verify that Windows can resolve Qt DLLs.
          $stdout = Join-Path $env:RUNNER_TEMP "native-installed-stdout.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "native-installed-stderr.txt"
          $installedExe = Join-Path $destination "IMSATCAD.exe"
          $oldPath = $env:PATH
          try {
            # Remove Qt installation and QCAD build folders from PATH.
            $env:PATH = (($oldPath -split ';' | Where-Object {
              $_ -and $_ -notmatch '(?i)[\\/]Qt[\\/]' -and
              $_ -notmatch '(?i)native[\\/]qcad'
            }) -join ';')
            $proc = Start-Process -FilePath $installedExe -ArgumentList @("-no-gui", "-help") -WorkingDirectory $destination -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
            if (-not $proc.WaitForExit(45000)) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              throw "Installed CAD executable timed out"
            }
            $proc.Refresh()
            if ($proc.ExitCode -ne 0) {
              Get-Content $stderr -ErrorAction SilentlyContinue | Select-Object -First 50
              throw "Installed CAD failed to start: exit code $($proc.ExitCode)"
            }
          } finally {
            $env:PATH = $oldPath
          }
          # Verify that a real GUI window can be created by the installed EXE.
          # GitHub Windows runners can differ from a user's interactive desktop.
          $gui = Start-Process -FilePath $installedExe -WorkingDirectory $destination -PassThru
          $windowFound = $false
          try {
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Seconds 1
              $gui.Refresh()
              if ($gui.HasExited) { throw "Native CAD GUI exited early with code $($gui.ExitCode)" }
              if ($gui.MainWindowHandle -ne [IntPtr]::Zero) {
                $windowFound = $true
                break
              }
            }
            if (-not $windowFound) { throw "Native CAD did not create a main window within 30 seconds" }
          } finally {
            if (-not $gui.HasExited) { Stop-Process -Id $gui.Id -Force -ErrorAction SilentlyContinue }
          }
          "Installed GUI window creation: PASS" | Set-Content "native-gui-startup.txt"
          # A GUI window alone does not prove the IMSAT add-on initialized.
          # Capture native startup output separately from GUI acceptance.
          $startupOutput = ((Get-Content $stdout -Raw -ErrorAction SilentlyContinue) + "`n" + (Get-Content $stderr -Raw -ErrorAction SilentlyContinue))
          $ribbonDiagnostics = @(
            "RibbonInitializationInHeadlessLog=" + [bool]($startupOutput -match 'IMSAT CAD Ribbon initialized:'),
            "AliasInitializationInHeadlessLog=" + [bool]($startupOutput -match 'IMSAT CAD: [0-9]+/[0-9]+ aliases'),
            "RibbonBlockedInHeadlessLog=" + [bool]($startupOutput -match 'IMSAT CAD RIBBON BLOCKED')
          )
          $ribbonDiagnostics | Set-Content "native-ribbon-diagnostics.txt" -Encoding UTF8
          Write-Host ($ribbonDiagnostics -join "; ")
          # Preserve the captured output for diagnosis when add-on startup is silent.
          $startupOutput | Set-Content "native-startup-output.txt" -Encoding UTF8
          if ($startupOutput -match 'IMSAT CAD RIBBON BLOCKED') {
            throw "Native CAD reported Ribbon initialization failure; inspect native-startup-output.txt"
          }
          # Headless output is diagnostic only; do not claim Ribbon acceptance
          # when Qt does not initialize an interactive document window.
          $ribbonLogObserved = [bool]($startupOutput -match 'IMSAT CAD Ribbon initialized:')
          $ribbonAudit = @(
            "HeadlessRibbonInitializationObserved=$ribbonLogObserved",
            "InstalledGuiWindowCreated=$windowFound",
            "InteractiveRibbonTabSwitching=NOT_TESTED",
            "InteractiveNativeActionInvocation=NOT_TESTED",
            "RibbonAcceptance=NOT_READY"
          )
          $ribbonAudit | Set-Content "native-ribbon-acceptance.txt" -Encoding UTF8

          # Record real installed binary identity. Copying qcad.exe under a new
          # filename is not a completed IMSAT-branded native application.
          $installedInfo = (Get-Item $installedExe).VersionInfo
          $identity = @(
            "Executable=$($installedExe)",
            "ProductName=$($installedInfo.ProductName)",
            "FileDescription=$($installedInfo.FileDescription)",
            "OriginalFilename=$($installedInfo.OriginalFilename)",
            "CompanyName=$($installedInfo.CompanyName)",
            "GUIWindowCreated=$windowFound",
            "RibbonTabsInteractivelyVerified=NO",
            "NativeCommandClickTests=NOT_RUN",
            "BrandingGate=NOT_READY"
          )
          $identity | Set-Content "native-branding-audit.txt" -Encoding UTF8
          Write-Host "Native branding audit saved; GUI Ribbon and branding remain unverified"

                    $startupOutput = ((Get-Content $stdout -Raw -ErrorAction SilentlyContinue) + "`n" + (Get-Content $stderr -Raw -ErrorAction SilentlyContinue))
          if ($startupOutput -match '(?i)Cannot load library.*qcadjsapi|No script handler found|Plugin loader reported error') {
            throw "Installed CAD JavaScript plugin failed to load: $startupOutput"
          }
          "Installed executable headless launch: PASS" | Set-Content "native-installed-startup.txt"
          $uninstaller = Join-Path $destination "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Native CAD uninstaller missing" }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Native uninstaller exited with $($uninstall.ExitCode)" }
          "Native installer: PASS" | Set-Content "native-install-smoke.txt"
          "Native uninstaller: PASS" | Add-Content "native-install-smoke.txt"
          "GUI functional test: NOT RUN" | Add-Content "native-install-smoke.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: imsat-cad-native-qcad-build-evidence
          path: |
            imsat-cad-native-windows-build.zip
