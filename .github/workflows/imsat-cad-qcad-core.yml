name: IMSAT CAD Native QCAD Core Feasibility (GPLv3)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/imsat-cad-qcad-core.yml"
      - "tools/IMSAT_CAD_V1/qcad_addon/**"
  push:
    branches: [imsat-cad-foundation]
    paths:
      - ".github/workflows/imsat-cad-qcad-core.yml"
      - "tools/IMSAT_CAD_V1/qcad_addon/**"
concurrency:
  group: imsat-cad-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-cad-core:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6 for MSVC
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.5.3"
          arch: win64_msvc2019_64
          modules: "qt5compat qtpositioning qtlocation"
          cache: true
      - name: Initialize MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
      - name: Fetch version-matched upstream CAD engine
        shell: pwsh
        run: |
          git clone --depth 1 --branch v3.32.2.0 https://github.com/qcad/qcad.git native/qcad
          git clone --depth 1 --branch v3.32.2.0 https://github.com/qcad/qtjsapi.git native/qtjsapi
          git clone --depth 1 --branch v3.32.2.0 https://github.com/qcad/qcadjsapi.git native/qcadjsapi
          git -C native/qcad rev-parse HEAD | Out-File -Append native-commit-report.txt
          git -C native/qtjsapi rev-parse HEAD | Out-File -Append native-commit-report.txt
          git -C native/qcadjsapi rev-parse HEAD | Out-File -Append native-commit-report.txt
      - name: Validate and install IMSAT CAD command aliases
        shell: pwsh
        run: |
          node --check tools/IMSAT_CAD_V1/qcad_addon/IMSATCAD/IMSATCAD.js
          node tools/IMSAT_CAD_V1/qcad_addon/check-addon.js
          Copy-Item -Recurse tools/IMSAT_CAD_V1/qcad_addon/IMSATCAD native/qcad/scripts/IMSATCAD
      - name: Validate IMSAT aliases against pinned QCAD script tree
        shell: pwsh
        run: |
          $addon = Get-Content "tools/IMSAT_CAD_V1/qcad_addon/IMSATCAD/IMSATCAD.js" -Raw
          $matches = [regex]::Matches($addon, '\["(scripts/[^"]+\.js)",\s*\[')
          if ($matches.Count -lt 10) { throw "Too few IMSAT CAD command mappings found" }
          $missing = @()
          foreach ($match in $matches) {
            $script = $match.Groups[1].Value
            if (-not (Test-Path (Join-Path "native/qcad" $script))) {
              $missing += $script
            }
          }
          if ($missing.Count -gt 0) {
            throw ("IMSAT CAD aliases refer to missing upstream actions: " + ($missing -join ", "))
          }
          Write-Host "IMSAT CAD alias script existence PASS: $($matches.Count) mappings"
      - name: Validate native IMSAT toolbar action paths
        shell: pwsh
        run: |
          $addon = Get-Content "tools/IMSAT_CAD_V1/qcad_addon/IMSATCAD/IMSATCAD.js" -Raw
          $sections = @("_drawScripts", "_modifyScripts", "_annotationScripts", "_layerScripts", "_utilityScripts", "_blockScripts", "_selectionScripts", "_fileScripts")
          $missing = @()
          $total = 0
          foreach ($section in $sections) {
            $pattern = '(?s)IMSATCAD\.' + [regex]::Escape($section) + '\s*=\s*\[(.*?)\];'
            $match = [regex]::Match($addon, $pattern)
            if (-not $match.Success) { throw "Missing toolbar section: $section" }
            $paths = [regex]::Matches($match.Groups[1].Value, '"(scripts/[^"]+\.js)"')
            if ($paths.Count -eq 0) { throw "No actions configured in $section" }
            foreach ($item in $paths) {
              $total++
              $script = $item.Groups[1].Value
              if (-not (Test-Path (Join-Path "native/qcad" $script))) { $missing += "$section : $script" }
            }
          }
          if ($missing.Count -gt 0) { throw ("Missing native toolbar scripts: " + ($missing -join "; ")) }
          Write-Host "IMSAT CAD native toolbar source paths PASS: $total actions"

      - name: Fix vendored zlib linkage for MSVC
        shell: pwsh
        run: |
          # Upstream v3.32.2.0 uses a shared zlib without dllexport annotations.
          # MSVC can build zlib.dll but produce no import .lib, causing LNK1181.
          # Build vendored zlib AND OpenNURBS as static dependencies; drop GNU
          # "-L/path" flags that MSVC interprets as invalid /L switches.
          $zlib = "native/qcad/src/3rdparty/opennurbs/zlib/CMakeLists.txt"
          $zc = [IO.File]::ReadAllText($zlib)
          if (-not $zc.Contains("add_library(zlib SHARED")) { throw "Unexpected pinned QCAD zlib CMake contents" }
          $zc = $zc.Replace("add_library(zlib SHARED", "add_library(zlib STATIC")
          $zc = ($zc -split "`r?`n" | Where-Object { $_ -notmatch '^\s*target_link_libraries\(zlib PUBLIC -L' }) -join "`n"
          [IO.File]::WriteAllText($zlib, $zc)
          $on = "native/qcad/src/3rdparty/opennurbs/opennurbs/CMakeLists.txt"
          $oc = [IO.File]::ReadAllText($on)
          if (-not $oc.Contains("add_library(opennurbs SHARED")) { throw "Unexpected pinned OpenNURBS CMake contents" }
          $oc = $oc.Replace("add_library(opennurbs SHARED", "add_library(opennurbs STATIC")
          $oc = ($oc -split "`r?`n" | Where-Object { $_ -notmatch '^\s*target_link_libraries\(opennurbs PUBLIC -L' }) -join "`n"
          [IO.File]::WriteAllText($on, $oc)
          $parent = "native/qcad/src/3rdparty/opennurbs/CMakeLists.txt"
          $cmakeRoot = (Resolve-Path "native/qcad").Path.Replace([char]92, "/")
          $release = "$cmakeRoot/release"
          $cmake = 'set_target_properties(zlib opennurbs PROPERTIES ARCHIVE_OUTPUT_DIRECTORY "{0}" LIBRARY_OUTPUT_DIRECTORY "{0}" RUNTIME_OUTPUT_DIRECTORY "{0}")' -f $release
          Add-Content -Path $parent -Value $cmake
      - name: Work around MSVC OpenNURBS optimizer ICE (C1001)
        shell: pwsh
        run: |
          $cm = 'native/qcad/src/3rdparty/opennurbs/CMakeLists.txt'
          Add-Content -Path $cm -Value ''
          Add-Content -Path $cm -Value '# IMSAT CI-only workaround: MSVC /O2 ICE in opennurbs_lookup.cpp'
          Add-Content -Path $cm -Value 'if(MSVC)'
          Add-Content -Path $cm -Value '  set_source_files_properties(opennurbs_lookup.cpp PROPERTIES COMPILE_OPTIONS "/Od")'
          Add-Content -Path $cm -Value 'endif()'
      - name: Build QCAD core
        shell: pwsh
        run: |
          cmake -S native/qcad -B native/qcad -G Ninja -DBUILD_QT6=ON -DCMAKE_BUILD_TYPE=Release "-DCMAKE_CXX_FLAGS_RELEASE=/Od /DNDEBUG /MD" "-DCMAKE_C_FLAGS_RELEASE=/Od /DNDEBUG /MD"
          cmake --build native/qcad --parallel 4
      - name: Build Qt JavaScript integration
        shell: pwsh
        run: |
          cmake -S native/qtjsapi -B native/qtjsapi -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build native/qtjsapi --parallel 4
      - name: Build QCAD JavaScript API
        shell: pwsh
        run: |
          cmake -S native/qcadjsapi -B native/qcadjsapi -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build native/qcadjsapi --parallel 4
      - name: Verify native CAD executable and plugins
        shell: pwsh
        run: |
          $exe = Get-ChildItem native/qcad/release -File -Filter "qcad*.exe" | Select-Object -First 1
          if ($null -eq $exe) { throw "No native QCAD executable was produced" }
          $js = Get-ChildItem native/qcad/plugins -File -Filter "*qcadjsapi*.dll" | Select-Object -First 1
          if ($null -eq $js) { throw "Missing JavaScript CAD API plugin" }
          Write-Host "Native CAD executable: $($exe.FullName)"
          Write-Host "CAD JavaScript API: $($js.FullName)"
      - name: Verify Windows loader dependencies for native QCAD
        shell: pwsh
        run: |
          $exe = Get-ChildItem native/qcad/release -File -Filter "qcad*.exe" | Select-Object -First 1
          if (-not $exe) { throw "Native QCAD executable missing" }
          $qtBin = (Get-Command windeployqt.exe -ErrorAction Stop).Source
          & $qtBin --dry-run --list mapping $exe.FullName | Out-File native-qt-dependencies.txt
          if ($LASTEXITCODE -ne 0) { throw "Qt deployment dependency inspection failed" }
          if (-not (Test-Path native-qt-dependencies.txt)) { throw "Dependency manifest missing" }
          Write-Host "Qt runtime dependency manifest generated"
      - name: Deploy Qt runtime alongside native CAD executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem native/qcad/release -File -Filter "qcad*.exe" | Select-Object -First 1
          if (-not $exe) { throw "Native QCAD executable missing" }
          $qtBin = (Get-Command windeployqt.exe -ErrorAction Stop).Source
          & $qtBin --release --compiler-runtime $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }
          $platforms = Join-Path $exe.DirectoryName "platforms/qwindows.dll"
          if (-not (Test-Path $platforms)) { throw "Qt Windows platform plugin missing" }
          Write-Host "Native CAD Qt runtime deployed: $($exe.DirectoryName)"
      - name: Verify packaged native CAD dependencies
        shell: pwsh
        run: |
          $release = "native/qcad/release"
          $exe = Get-ChildItem $release -File -Filter "qcad*.exe" | Select-Object -First 1
          if (-not $exe) { throw "Native QCAD executable missing" }
          foreach ($dll in @("Qt6Core.dll", "Qt6Gui.dll", "Qt6Widgets.dll")) {
            if (-not (Test-Path (Join-Path $release $dll))) { throw "Missing packaged dependency: $dll" }
          }
          if (-not (Test-Path (Join-Path $release "platforms/qwindows.dll"))) {
            throw "Missing Windows platform plugin"
          }
          Write-Host "Native CAD deployment dependency gate PASS (not a GUI runtime test)"
      - name: Check native CAD executable starts in headless mode
        shell: pwsh
        run: |
          $exe = Get-ChildItem "native/qcad/release" -File -Filter "qcad*.exe" | Select-Object -First 1
          if (-not $exe) { throw "Native CAD executable missing" }
          $stdout = Join-Path $env:RUNNER_TEMP "imsat-cad-smoke-stdout.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "imsat-cad-smoke-stderr.txt"
          $proc = Start-Process -FilePath $exe.FullName -ArgumentList @("-no-gui", "-help") -WorkingDirectory $exe.DirectoryName -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          if (-not $proc.WaitForExit(45000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "Native CAD headless startup timed out"
          }
          $proc.Refresh()
          Get-Content $stdout -ErrorAction SilentlyContinue | Select-Object -First 40
          Get-Content $stderr -ErrorAction SilentlyContinue | Select-Object -First 40
          if ($proc.ExitCode -ne 0) { throw "Native CAD headless startup failed with exit code $($proc.ExitCode)" }
          "ExitCode=$($proc.ExitCode)" | Set-Content "native-headless-smoke.txt"
          "Executable=$($exe.Name)" | Add-Content "native-headless-smoke.txt"
          "Arguments=-no-gui -help" | Add-Content "native-headless-smoke.txt"
          Get-Content $stdout -ErrorAction SilentlyContinue | Select-Object -First 80 | Add-Content "native-headless-smoke.txt"
          Get-Content $stderr -ErrorAction SilentlyContinue | Select-Object -First 80 | Add-Content "native-headless-smoke.txt"
          Write-Host "Native CAD headless startup PASS (GUI interaction not validated)"
      - name: Stage native CAD application with scripts and plugins
        shell: pwsh
        run: |
          $stage = "native-cad-stage"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "native/qcad/release/*" $stage -Recurse -Force
          New-Item -ItemType Directory -Force "$stage/scripts", "$stage/plugins" | Out-Null
          Copy-Item "native/qcad/scripts/*" "$stage/scripts" -Recurse -Force
          Copy-Item "native/qcad/plugins/*" "$stage/plugins" -Recurse -Force
          if (-not (Test-Path "$stage/scripts/IMSATCAD/IMSATCAD.js")) {
            throw "IMSAT CAD add-on missing from native package"
          }
          if (-not (Get-ChildItem "$stage/plugins" -Filter "*qcadjsapi*.dll" -File)) {
            throw "QCAD JavaScript API missing from native package"
          }
          if (-not (Get-ChildItem $stage -Filter "qcad*.exe" -File)) {
            throw "QCAD executable missing from native package"
          }
          Compress-Archive -Path "$stage/*" -DestinationPath "imsat-cad-native-windows-build.zip" -Force
          if (-not (Test-Path "imsat-cad-native-windows-build.zip")) {
            throw "Native CAD ZIP staging failed"
          }
          Write-Host "Native CAD staged with IMSAT scripts (runtime not yet validated)"
      - uses: actions/upload-artifact@v4
        with:
          name: imsat-cad-native-qcad-build-evidence
          path: |
            imsat-cad-native-windows-build.zip
            native-commit-report.txt
            native-qt-dependencies.txt
            native-headless-smoke.txt
            native/qcad/release/*.exe
            native/qcad/release/*.dll
            native/qcad/release/platforms/*.dll
            native/qcad/plugins/*qcadjsapi*.dll
          retention-days: 7
          if-no-files-found: error
# Prototype only: no rebranding, installer, or DWG feature is claimed.
# Upstream QCAD remains GPLv3. Any distributed modified core must include corresponding source and notices.
