name: IMSAT CAD Native QCAD Core Feasibility (GPLv3)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/imsat-cad-qcad-core.yml"
      - "tools/IMSAT_CAD_V1/qcad_addon/**"
      - "tools/IMSAT_CAD_V1/imsatcad-native-v1.iss"
      - "tools/IMSAT_CAD_V1/generate-brand.py"
      - "tools/IMSAT_CAD_V1/brand-native-qcad.js"
      - "tools/IMSAT_CAD_V1/assets/**"
  push:
    branches: [imsat-cad-foundation]
    paths:
      - ".github/workflows/imsat-cad-qcad-core.yml"
      - "tools/IMSAT_CAD_V1/qcad_addon/**"
      - "tools/IMSAT_CAD_V1/imsatcad-native-v1.iss"
      - "tools/IMSAT_CAD_V1/generate-brand.py"
      - "tools/IMSAT_CAD_V1/brand-native-qcad.js"
      - "tools/IMSAT_CAD_V1/assets/**"
concurrency:
  group: imsat-cad-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-cad-core:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Fast static add-on preflight
        shell: pwsh
        run: |
          node --check tools/IMSAT_CAD_V1/qcad_addon/IMSATCAD/IMSATCAD.js
          node --check tools/IMSAT_CAD_V1/brand-native-qcad.js
          node tools/IMSAT_CAD_V1/qcad_addon/check-addon.js
          node tools/IMSAT_CAD_V1/qcad_addon/test-addon-runtime.js
      - name: Install Qt 6 for MSVC
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.5.3"
          arch: win64_msvc2019_64
          modules: "qt5compat qtpositioning qtlocation"
          cache: true
      - name: Initialize MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
      - name: Fetch version-matched upstream CAD engine
        shell: pwsh
        run: |
          git clone --depth 1 --branch v3.32.2.0 https://github.com/qcad/qcad.git native/qcad
          git clone --depth 1 --branch v3.32.2.0 https://github.com/qcad/qtjsapi.git native/qtjsapi
          git clone --depth 1 --branch v3.32.2.0 https://github.com/qcad/qcadjsapi.git native/qcadjsapi
          git -C native/qcad rev-parse HEAD | Out-File -Append native-commit-report.txt
          git -C native/qtjsapi rev-parse HEAD | Out-File -Append native-commit-report.txt
          git -C native/qcadjsapi rev-parse HEAD | Out-File -Append native-commit-report.txt
      - name: Brand native QCAD CE executable before compilation
        shell: pwsh
        run: |
          # Patch the pinned GPLv3 source, not just the installer or filename.
          # DLL resource metadata and upstream copyright notices stay unchanged.
          python -m pip install --disable-pip-version-check Pillow
          if ($LASTEXITCODE -ne 0) { throw "Pillow installation failed" }
          python tools/IMSAT_CAD_V1/generate-brand.py
          if ($LASTEXITCODE -ne 0) { throw "IMSAT icon generation failed" }
          $icon = "tools/IMSAT_CAD_V1/assets/imsatcad.ico"
          node tools/IMSAT_CAD_V1/brand-native-qcad.js native/qcad $icon
          if ($LASTEXITCODE -ne 0) { throw "Native IMSAT CAD source branding failed" }
      - name: Install IMSAT CAD add-on and deterministic native startup
        shell: pwsh
        run: |
          Copy-Item -Recurse tools/IMSAT_CAD_V1/qcad_addon/IMSATCAD native/qcad/scripts/IMSATCAD
          # QCAD CE autostart loads plug-ins dynamically. A copied add-on
          # directory alone does not prove its postInit was invoked in the
          # packaged executable. Install an idempotent fallback at the actual
          # upstream postInit point so the Ribbon can initialize on every
          # normal installed GUI launch, not only under the test runner.
          $startup = "native/qcad/scripts/autostart.js"
          $source = [IO.File]::ReadAllText($startup)
          $anchor = "    postInitAddOns(addOns);"
          if ($source.Split([string[]]@($anchor), [StringSplitOptions]::None).Length -ne 2) {
            throw "Pinned QCAD autostart changed: cannot safely install IMSAT bootstrap"
          }
          $bootstrap = @'
              postInitAddOns(addOns);
              // IMSAT CAD GPLv3 integration: initialize only if upstream add-on
              // discovery has not already mounted the native Ribbon.
              try {
                  if (typeof IMSATCAD === "undefined") {
                      include("scripts/IMSATCAD/IMSATCAD.js");
                      if (typeof IMSATCAD !== "undefined") {
                          IMSATCAD.init();
                      }
                  }
                  if (typeof IMSATCAD !== "undefined" && IMSATCAD._ribbonCreated !== true) {
                      IMSATCAD.postInit();
                  }
                  qWarning("IMSAT CAD bootstrap: loaded=" + (typeof IMSATCAD !== "undefined") +
                           " ribbon=" + (typeof IMSATCAD !== "undefined" && IMSATCAD._ribbonCreated === true));
              } catch (imsatBootstrapError) {
                  qWarning("IMSAT CAD bootstrap failed: " + imsatBootstrapError);
              }
          '@
          $bootstrap = ($bootstrap -split "`r?`n" | ForEach-Object { $_ -replace '^ {14}', '' }) -join "`n"
          $source = $source.Replace($anchor, $bootstrap.TrimEnd())
          [IO.File]::WriteAllText($startup, $source)
          if (-not ([IO.File]::ReadAllText($startup).Contains("IMSAT CAD bootstrap: loaded="))) {
            throw "IMSAT native bootstrap was not installed"
          }
      - name: Validate IMSAT aliases against pinned QCAD script tree
        shell: pwsh
        run: |
          $addon = Get-Content "tools/IMSAT_CAD_V1/qcad_addon/IMSATCAD/IMSATCAD.js" -Raw
          $matches = [regex]::Matches($addon, '\["(scripts/[^"]+\.js)",\s*\[')
          if ($matches.Count -lt 10) { throw "Too few IMSAT CAD command mappings found" }
          $missing = @()
          foreach ($match in $matches) {
            $script = $match.Groups[1].Value
            if (-not (Test-Path (Join-Path "native/qcad" $script))) {
              $missing += $script
            }
          }
          if ($missing.Count -gt 0) {
            throw ("IMSAT CAD aliases refer to missing upstream actions: " + ($missing -join ", "))
          }
          Write-Host "IMSAT CAD alias script existence PASS: $($matches.Count) mappings"
      - name: Validate native IMSAT toolbar action paths
        shell: pwsh
        run: |
          $addon = Get-Content "tools/IMSAT_CAD_V1/qcad_addon/IMSATCAD/IMSATCAD.js" -Raw
          $sections = @("_drawScripts", "_modifyScripts", "_annotationScripts", "_layerScripts", "_utilityScripts", "_blockScripts", "_selectionScripts", "_fileScripts")
          $missing = @()
          $total = 0
          foreach ($section in $sections) {
            $pattern = '(?s)IMSATCAD\.' + [regex]::Escape($section) + '\s*=\s*\[(.*?)\];'
            $match = [regex]::Match($addon, $pattern)
            if (-not $match.Success) { throw "Missing toolbar section: $section" }
            $paths = [regex]::Matches($match.Groups[1].Value, '"(scripts/[^"]+\.js)"')
            if ($paths.Count -eq 0) { throw "No actions configured in $section" }
            foreach ($item in $paths) {
              $total++
              $script = $item.Groups[1].Value
              if (-not (Test-Path (Join-Path "native/qcad" $script))) { $missing += "$section : $script" }
            }
          }
          if ($missing.Count -gt 0) { throw ("Missing native toolbar scripts: " + ($missing -join "; ")) }
          Write-Host "IMSAT CAD native toolbar source paths PASS: $total actions"

      - name: Fix vendored zlib linkage for MSVC
        shell: pwsh
        run: |
          # Upstream v3.32.2.0 uses a shared zlib without dllexport annotations.
          # MSVC can build zlib.dll but produce no import .lib, causing LNK1181.
          # Build vendored zlib AND OpenNURBS as static dependencies; drop GNU
          # "-L/path" flags that MSVC interprets as invalid /L switches.
          $zlib = "native/qcad/src/3rdparty/opennurbs/zlib/CMakeLists.txt"
          $zc = [IO.File]::ReadAllText($zlib)
          if (-not $zc.Contains("add_library(zlib SHARED")) { throw "Unexpected pinned QCAD zlib CMake contents" }
          $zc = $zc.Replace("add_library(zlib SHARED", "add_library(zlib STATIC")
          $zc = ($zc -split "`r?`n" | Where-Object { $_ -notmatch '^\s*target_link_libraries\(zlib PUBLIC -L' }) -join "`n"
          [IO.File]::WriteAllText($zlib, $zc)
          $on = "native/qcad/src/3rdparty/opennurbs/opennurbs/CMakeLists.txt"
          $oc = [IO.File]::ReadAllText($on)
          if (-not $oc.Contains("add_library(opennurbs SHARED")) { throw "Unexpected pinned OpenNURBS CMake contents" }
          $oc = $oc.Replace("add_library(opennurbs SHARED", "add_library(opennurbs STATIC")
          $oc = ($oc -split "`r?`n" | Where-Object { $_ -notmatch '^\s*target_link_libraries\(opennurbs PUBLIC -L' }) -join "`n"
          [IO.File]::WriteAllText($on, $oc)
          $parent = "native/qcad/src/3rdparty/opennurbs/CMakeLists.txt"
          $cmakeRoot = (Resolve-Path "native/qcad").Path.Replace([char]92, "/")
          $release = "$cmakeRoot/release"
          $cmake = 'set_target_properties(zlib opennurbs PROPERTIES ARCHIVE_OUTPUT_DIRECTORY "{0}" LIBRARY_OUTPUT_DIRECTORY "{0}" RUNTIME_OUTPUT_DIRECTORY "{0}")' -f $release
          Add-Content -Path $parent -Value $cmake
      - name: Work around MSVC OpenNURBS optimizer ICE (C1001)
        shell: pwsh
        run: |
          $cm = 'native/qcad/src/3rdparty/opennurbs/CMakeLists.txt'
          Add-Content -Path $cm -Value ''
          Add-Content -Path $cm -Value '# IMSAT CI-only workaround: MSVC /O2 ICE in opennurbs_lookup.cpp'
          Add-Content -Path $cm -Value 'if(MSVC)'
          Add-Content -Path $cm -Value '  set_source_files_properties(opennurbs_lookup.cpp PROPERTIES COMPILE_OPTIONS "/Od")'
          Add-Content -Path $cm -Value 'endif()'
      - name: Build QCAD core
        shell: pwsh
        run: |
          cmake -S native/qcad -B native/qcad -G Ninja -DBUILD_QT6=ON -DCMAKE_BUILD_TYPE=Release "-DCMAKE_CXX_FLAGS_RELEASE=/Od /DNDEBUG /MD" "-DCMAKE_C_FLAGS_RELEASE=/Od /DNDEBUG /MD"
          cmake --build native/qcad --parallel 4
      - name: Build Qt JavaScript integration
        shell: pwsh
        run: |
          cmake -S native/qtjsapi -B native/qtjsapi -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build native/qtjsapi --parallel 4
      - name: Build QCAD JavaScript API
        shell: pwsh
        run: |
          cmake -S native/qcadjsapi -B native/qcadjsapi -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build native/qcadjsapi --parallel 4
      - name: Verify native CAD executable and plugins
        shell: pwsh
        run: |
          $exe = Get-ChildItem native/qcad/release -File -Filter "qcad*.exe" | Select-Object -First 1
          if ($null -eq $exe) { throw "No native QCAD executable was produced" }
          $js = Get-ChildItem native/qcad/plugins -File -Filter "*qcadjsapi*.dll" | Select-Object -First 1
          if ($null -eq $js) { throw "Missing JavaScript CAD API plugin" }
          Write-Host "Native CAD executable: $($exe.FullName)"
          Write-Host "CAD JavaScript API: $($js.FullName)"
      - name: Inspect JavaScript plugin dependencies
        shell: pwsh
        run: |
          $plugin = Get-ChildItem "native/qcad/plugins" -Filter "*qcadjsapi*.dll" -File | Select-Object -First 1
          if (-not $plugin) { throw "QCAD JavaScript plugin missing" }
          & dumpbin.exe /DEPENDENTS $plugin.FullName | Out-File "native-plugin-dependencies.txt"
          if ($LASTEXITCODE -ne 0) { throw "Plugin dependency inspection failed" }
          $qtBinDir = Split-Path (Get-Command windeployqt.exe -ErrorAction Stop).Source -Parent
          $names = [regex]::Matches((Get-Content "native-plugin-dependencies.txt" -Raw), '(?im)^\s*(Qt6[A-Za-z0-9_]+\.dll)\s*$') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          foreach ($name in $names) {
            $source = Join-Path $qtBinDir $name
            if (-not (Test-Path $source)) { throw "Plugin Qt dependency unavailable: $name" }
            Copy-Item $source (Join-Path "native/qcad/release" $name) -Force
          }
      - name: Verify Windows loader dependencies for native QCAD
        shell: pwsh
        run: |
          $exe = Get-ChildItem native/qcad/release -File -Filter "qcad*.exe" | Select-Object -First 1
          if (-not $exe) { throw "Native QCAD executable missing" }
          $qtBin = (Get-Command windeployqt.exe -ErrorAction Stop).Source
          & $qtBin --dry-run --list mapping $exe.FullName | Out-File native-qt-dependencies.txt
          if ($LASTEXITCODE -ne 0) { throw "Qt deployment dependency inspection failed" }
          if (-not (Test-Path native-qt-dependencies.txt)) { throw "Dependency manifest missing" }
          Write-Host "Qt runtime dependency manifest generated"
      - name: Deploy Qt runtime alongside native CAD executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem native/qcad/release -File -Filter "qcad*.exe" | Select-Object -First 1
          if (-not $exe) { throw "Native QCAD executable missing" }
          $qtBin = (Get-Command windeployqt.exe -ErrorAction Stop).Source
          & $qtBin --release --compiler-runtime $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }
          $platforms = Join-Path $exe.DirectoryName "platforms/qwindows.dll"
          if (-not (Test-Path $platforms)) { throw "Qt Windows platform plugin missing" }
          # windeployqt scans the executable, but QCAD loads additional Qt
          # modules indirectly through its CAD/JavaScript plugins.
          $qtBinDir = Split-Path $qtBin -Parent
          $runtime = @("Qt6Concurrent.dll", "Qt6PrintSupport.dll", "Qt6Qml.dll")
          foreach ($dll in $runtime) {
            $source = Join-Path $qtBinDir $dll
            if (-not (Test-Path $source)) { throw "Qt runtime unavailable: $source" }
            Copy-Item $source (Join-Path $exe.DirectoryName $dll) -Force
          }
          # qcadjsapi loads Qt modules dynamically; windeployqt(qcad.exe)
          # alone does not discover plugin-only and transitive Qt dependencies.
          $qtModules = Get-ChildItem $qtBinDir -File -Filter "Qt6*.dll"
          if ($qtModules.Count -lt 15) { throw "Qt deployment directory appears incomplete" }
          foreach ($module in $qtModules) {
            Copy-Item $module.FullName (Join-Path $exe.DirectoryName $module.Name) -Force
          }
          Write-Host "Bundled $($qtModules.Count) Qt6 runtime DLLs for dynamically loaded CAD plugins"
          Write-Host "Native CAD Qt runtime deployed: $($exe.DirectoryName)"
      - name: Verify packaged native CAD dependencies
        shell: pwsh
        run: |
          $release = "native/qcad/release"
          $exe = Get-ChildItem $release -File -Filter "qcad*.exe" | Select-Object -First 1
          if (-not $exe) { throw "Native QCAD executable missing" }
          foreach ($dll in @("Qt6Core.dll", "Qt6Gui.dll", "Qt6Widgets.dll", "Qt6Concurrent.dll", "Qt6PrintSupport.dll", "Qt6Qml.dll")) {
            if (-not (Test-Path (Join-Path $release $dll))) { throw "Missing packaged dependency: $dll" }
          }
          if (-not (Test-Path (Join-Path $release "platforms/qwindows.dll"))) {
            throw "Missing Windows platform plugin"
          }
          Write-Host "Native CAD deployment dependency gate PASS (not a GUI runtime test)"
      - name: Check native CAD executable starts in headless mode
        shell: pwsh
        run: |
          $exe = Get-ChildItem "native/qcad/release" -File -Filter "qcad*.exe" | Select-Object -First 1
          if (-not $exe) { throw "Native CAD executable missing" }
          $stdout = Join-Path $env:RUNNER_TEMP "imsat-cad-smoke-stdout.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "imsat-cad-smoke-stderr.txt"
          $proc = Start-Process -FilePath $exe.FullName -ArgumentList @("-no-gui", "-help") -WorkingDirectory $exe.DirectoryName -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          if (-not $proc.WaitForExit(45000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "Native CAD headless startup timed out"
          }
          $proc.Refresh()
          Get-Content $stdout -ErrorAction SilentlyContinue | Select-Object -First 40
          Get-Content $stderr -ErrorAction SilentlyContinue | Select-Object -First 40
          if ($proc.ExitCode -ne 0) { throw "Native CAD headless startup failed with exit code $($proc.ExitCode)" }
          "ExitCode=$($proc.ExitCode)" | Set-Content "native-headless-smoke.txt"
          "Executable=$($exe.Name)" | Add-Content "native-headless-smoke.txt"
          "Arguments=-no-gui -help" | Add-Content "native-headless-smoke.txt"
          Get-Content $stdout -ErrorAction SilentlyContinue | Select-Object -First 80 | Add-Content "native-headless-smoke.txt"
          Get-Content $stderr -ErrorAction SilentlyContinue | Select-Object -First 80 | Add-Content "native-headless-smoke.txt"
          Write-Host "Native CAD headless startup PASS (GUI interaction not validated)"
      - name: Stage native CAD application with scripts and plugins
        shell: pwsh
        run: |
          $stage = "native-cad-stage"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "native/qcad/release/*" $stage -Recurse -Force
          New-Item -ItemType Directory -Force "$stage/scripts", "$stage/plugins" | Out-Null
          Copy-Item "native/qcad/scripts/*" "$stage/scripts" -Recurse -Force
          Copy-Item "native/qcad/plugins/*" "$stage/plugins" -Recurse -Force
          New-Item -ItemType Directory -Force "$stage/licenses" | Out-Null
          Copy-Item "native/qcad/LICENSE.txt" "$stage/licenses/QCAD-LICENSE.txt" -Force
          @"
          IMSAT CAD native prototype - QCAD Community Edition v3.32.2.0
          Based on QCAD, licensed under GNU GPL version 3.
          QCAD upstream source: https://github.com/qcad/qcad/tree/v3.32.2.0
          Qt JavaScript API source: https://github.com/qcad/qtjsapi/tree/v3.32.2.0
          QCAD JavaScript API source: https://github.com/qcad/qcadjsapi/tree/v3.32.2.0
          IMSAT integration source: https://github.com/buithenamktm-coder/TKV_ATVSLD
          This is a development build, NOT a tested release.
          "@ | Set-Content "$stage/licenses/SOURCE_AND_STATUS.txt" -Encoding UTF8
          if (-not (Test-Path "$stage/licenses/QCAD-LICENSE.txt")) {
            throw "Native package is missing upstream QCAD license"
          }
          if (-not (Test-Path "$stage/scripts/IMSATCAD/IMSATCAD.js")) {
            throw "IMSAT CAD add-on missing from native package"
          }
          if (-not (Get-ChildItem "$stage/plugins" -Filter "*qcadjsapi*.dll" -File)) {
            throw "QCAD JavaScript API missing from native package"
          }
          if (-not (Get-ChildItem $stage -Filter "qcad*.exe" -File)) {
            throw "QCAD executable missing from native package"
          }
          $required = @(
            "scripts/IMSATCAD/IMSATCAD.js",
            "licenses/QCAD-LICENSE.txt",
            "licenses/SOURCE_AND_STATUS.txt",
            "platforms/qwindows.dll",
            "Qt6Concurrent.dll",
            "Qt6PrintSupport.dll",
            "Qt6Qml.dll"
          )
          foreach ($item in $required) {
            if (-not (Test-Path (Join-Path $stage $item))) { throw "Native package missing: $item" }
          }
          Get-ChildItem $stage -Recurse -File |
            ForEach-Object {
              [pscustomobject]@{
                Path = $_.FullName.Substring((Resolve-Path $stage).Path.Length + 1).Replace([char]92, "/")
                Size = $_.Length
                SHA256 = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash
              }
            } | Sort-Object Path | Export-Csv "native-package-manifest.csv" -NoTypeInformation -Encoding UTF8
          if (-not (Test-Path "native-package-manifest.csv")) { throw "Native package manifest missing" }
          Compress-Archive -Path "$stage/*" -DestinationPath "imsat-cad-native-windows-build.zip" -Force
          if (-not (Test-Path "imsat-cad-native-windows-build.zip")) {
            throw "Native CAD ZIP staging failed"
          }
          Write-Host "Native CAD staged with IMSAT scripts (runtime not yet validated)"
      - name: Stage IMSAT CAD brand icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow
          if ($LASTEXITCODE -ne 0) { throw "Pillow installation failed" }
          python tools/IMSAT_CAD_V1/generate-brand.py
          if ($LASTEXITCODE -ne 0) { throw "Brand icon generation failed" }
          $icon = "tools/IMSAT_CAD_V1/assets/imsatcad.ico"
          if (-not (Test-Path $icon)) { throw "IMSAT icon missing" }
          New-Item -ItemType Directory -Force "native-cad-stage/branding" | Out-Null
          Copy-Item $icon "native-cad-stage/branding/imsatcad.ico" -Force
      - name: Build experimental native Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler missing" }
          if (-not (Test-Path "native-cad-stage/qcad.exe")) { throw "Native CAD entry executable missing" }
          Copy-Item "native-cad-stage/qcad.exe" "native-cad-stage/IMSATCAD.exe" -Force
          # Ensure the Windows installer includes the actual IMSAT add-on and
          # preserves upstream QCAD GPLv3 license and source information.
          $stageRequired = @(
            "native-cad-stage/IMSATCAD.exe",
            "native-cad-stage/scripts/IMSATCAD/IMSATCAD.js",
            "native-cad-stage/licenses/QCAD-LICENSE.txt",
            "native-cad-stage/licenses/SOURCE_AND_STATUS.txt",
            "native-cad-stage/branding/imsatcad.ico"
          )
          foreach ($item in $stageRequired) {
            if (-not (Test-Path $item)) { throw "IMSAT CAD installer prerequisite missing: $item" }
          }
          $stagedExeHash = (Get-FileHash "native-cad-stage/IMSATCAD.exe" -Algorithm SHA256).Hash
          $upstreamExeHash = (Get-FileHash "native-cad-stage/qcad.exe" -Algorithm SHA256).Hash
          "ExecutableIsUpstreamCopy=$($stagedExeHash -eq $upstreamExeHash)" | Set-Content "native-executable-origin.txt"
          $nativeInfo = (Get-Item "native-cad-stage/IMSATCAD.exe").VersionInfo
          $expectedIdentity = @{
            ProductName = "IMSAT CAD"
            FileDescription = "IMSAT CAD V1.0 (QCAD CE GPLv3)"
            InternalName = "IMSATCAD"
            OriginalFilename = "IMSATCAD.exe"
            CompanyName = "IMSAT"
          }
          foreach ($field in $expectedIdentity.Keys) {
            $actual = [string]$nativeInfo.$field
            if ($actual -ne $expectedIdentity[$field]) {
              throw "Native IMSAT CAD VERSIONINFO $field mismatch: '$actual' (expected '$($expectedIdentity[$field])')"
            }
            "$field=$actual" | Add-Content "native-executable-origin.txt"
          }
          "NativeBrandingResourceIdentity=PASS" | Add-Content "native-executable-origin.txt"
          Write-Host "Native IMSAT CAD VERSIONINFO identity PASS (upstream GPLv3 license preserved)"
          Copy-Item "tools/IMSAT_CAD_V1/imsatcad-native-v1.iss" "imsatcad-native-build.iss" -Force
          & $compiler "imsatcad-native-build.iss"
          if ($LASTEXITCODE -ne 0) { throw "Native Inno Setup compilation failed" }
          if (-not (Test-Path "IMSAT-CAD-V1.0-Setup.exe")) {
            throw "Native Windows setup was not generated"
          }
          Get-FileHash "IMSAT-CAD-V1.0-Setup.exe" -Algorithm SHA256 |
            Format-List | Out-String | Set-Content "native-installer-sha256.txt"
          Write-Host "Native development installer compiled; installation and GUI not yet tested"
      - name: Smoke test native installer and uninstaller
        shell: pwsh
        run: |
          $setup = (Resolve-Path "IMSAT-CAD-V1.0-Setup.exe").Path
          $destination = Join-Path $env:RUNNER_TEMP "IMSAT-CAD-Native-Install-Smoke"
          $install = Start-Process -FilePath $setup -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$destination") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Native installer exited with $($install.ExitCode)" }
          foreach ($relative in @("IMSATCAD.exe", "scripts/IMSATCAD/IMSATCAD.js", "licenses/QCAD-LICENSE.txt", "platforms/qwindows.dll", "Qt6Concurrent.dll", "Qt6PrintSupport.dll", "Qt6Qml.dll")) {
            if (-not (Test-Path (Join-Path $destination $relative))) { throw "Installed native CAD missing: $relative" }
          }
          # Launch installed binary from its installation directory rather
          # than the build tree; verify that Windows can resolve Qt DLLs.
          $stdout = Join-Path $env:RUNNER_TEMP "native-installed-stdout.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "native-installed-stderr.txt"
          $installedExe = Join-Path $destination "IMSATCAD.exe"
          $oldPath = $env:PATH
          try {
            # Remove Qt installation and QCAD build folders from PATH.
            $env:PATH = (($oldPath -split ';' | Where-Object {
              $_ -and $_ -notmatch '(?i)[\\/]Qt[\\/]' -and
              $_ -notmatch '(?i)native[\\/]qcad'
            }) -join ';')
            $proc = Start-Process -FilePath $installedExe -ArgumentList @("-no-gui", "-help") -WorkingDirectory $destination -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
            if (-not $proc.WaitForExit(45000)) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              throw "Installed CAD executable timed out"
            }
            $proc.Refresh()
            if ($proc.ExitCode -ne 0) {
              Get-Content $stderr -ErrorAction SilentlyContinue | Select-Object -First 50
              throw "Installed CAD failed to start: exit code $($proc.ExitCode)"
            }
          } finally {
            $env:PATH = $oldPath
          }
          # A headless -help launch does not initialize the QCAD ECMAScript
          # engine. Prove that the INSTALLED executable can execute JavaScript
          # before treating a missing Ribbon probe as a Ribbon defect.
          $runtimeScript = Join-Path $env:RUNNER_TEMP "imsat-cad-js-runtime-probe.js"
          'print("IMSAT_CAD_JS_ENGINE_PASS");' | Set-Content $runtimeScript -Encoding ascii
          $runtimeStdout = Join-Path $env:RUNNER_TEMP "imsat-cad-js-runtime-stdout.txt"
          $runtimeStderr = Join-Path $env:RUNNER_TEMP "imsat-cad-js-runtime-stderr.txt"
          $runtime = Start-Process -FilePath $installedExe -ArgumentList @("-allow-multiple-instances", "-no-gui", "-autostart", $runtimeScript) -WorkingDirectory $destination -RedirectStandardOutput $runtimeStdout -RedirectStandardError $runtimeStderr -Wait -PassThru
          $runtimeText = ((Get-Content $runtimeStdout -Raw -ErrorAction SilentlyContinue) + "`n" + (Get-Content $runtimeStderr -Raw -ErrorAction SilentlyContinue))
          $runtimeText | Set-Content "native-js-runtime-output.txt" -Encoding UTF8
          if ($runtime.ExitCode -ne 0 -or $runtimeText -notmatch "IMSAT_CAD_JS_ENGINE_PASS") {
            "JavaScriptRuntime=FAIL" | Set-Content "native-js-runtime-audit.txt"
            "ExitCode=$($runtime.ExitCode)" | Add-Content "native-js-runtime-audit.txt"
            throw "Installed native CAD cannot execute QCAD JavaScript; inspect native-js-runtime-output.txt"
          }
          "JavaScriptRuntime=PASS" | Set-Content "native-js-runtime-audit.txt"
          # Verify that a real GUI window can be created by the installed EXE.
          # GitHub Windows runners can differ from a user's interactive desktop.
          # Capture GUI process output, not only the separate -no-gui smoke log.
          # The interactive Qt add-on may initialize only after a document window opens.
          $guiStdout = Join-Path $env:RUNNER_TEMP "imsat-cad-gui-stdout.txt"
          $guiStderr = Join-Path $env:RUNNER_TEMP "imsat-cad-gui-stderr.txt"
          # Run an actual QCAD JavaScript probe after add-on postInit.
          # A created window alone is not proof that the IMSAT Ribbon works.
          $probeFile = Join-Path $env:TEMP "imsat-cad-native-probe.txt"
          Remove-Item $probeFile -Force -ErrorAction SilentlyContinue
          $probeScript = Join-Path $destination "scripts/IMSATCAD/IMSATCADProbe.js"
          if (-not (Test-Path $probeScript)) { throw "Installed QCAD Ribbon probe script missing: $probeScript" }
          # Validate the pinned upstream startup gate so future QCAD upgrades
          # cannot silently restore a blocking FirstStart dialog in CI.
          $autostart = Join-Path $destination "scripts/autostart.js"
          if (-not (Test-Path $autostart)) { throw "Installed QCAD autostart missing" }
          if ((Get-Content $autostart -Raw) -notmatch 'isFirstStart\s*&&\s*!args\.contains\("-locale"\)') {
            throw "QCAD first-start behavior changed; re-evaluate GUI test launch"
          }
          # An absolute path rules out a working-directory mismatch in -exec.
          # Pinned QCAD v3.32.2.0 autostart.js opens a modal FirstStart dialog
          # on a clean profile unless -locale is supplied. That dialog can be
          # mistaken for the CAD main window and prevents -exec from running.
          # -rescan also ensures the newly installed IMSAT add-on is discovered.
          $gui = Start-Process -FilePath $installedExe -ArgumentList @("-allow-multiple-instances", "-locale", "vi", "-rescan", "-exec", $probeScript) -WorkingDirectory $destination -RedirectStandardOutput $guiStdout -RedirectStandardError $guiStderr -PassThru
          $windowFound = $false
          $windowTitle = ""
          $tabNames = @()
          $uiaResult = "NOT_TESTED"
          $uiaDetail = "GUI did not expose an accessible tab hierarchy"
          $uiaTabInteraction = "NOT_TESTED"
          $uiaTabInteractionDetail = "SelectionItemPattern not yet inspected"
          $uiaLanguageInteraction = "NOT_TESTED"
          $uiaLanguageDetail = "InvokePattern not yet inspected"
          $uiaCadAction = "NOT_TESTED"
          $uiaCadDetail = "Native LINE command button has not been invoked"
          try {
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Seconds 1
              $gui.Refresh()
              if ($gui.HasExited) { throw "Native CAD GUI exited early with code $($gui.ExitCode)" }
              if ($gui.MainWindowHandle -ne [IntPtr]::Zero) {
                $windowFound = $true
                $windowTitle = $gui.MainWindowTitle
                break
              }
            }
            if (-not $windowFound) { throw "Native CAD did not create a main window within 30 seconds" }
            # QCAD creates its native window before postInit and -exec have
            # necessarily finished. Previous CI killed the process immediately
            # after finding a window, then waited for the probe file: that
            # terminated the very script whose result was required.
            # Keep the installed GUI alive until the native probe writes its
            # verdict, exits, or reaches the bounded 30-second deadline.
            for ($probeAttempt = 0; $probeAttempt -lt 60 -and -not (Test-Path $probeFile); $probeAttempt++) {
              Start-Sleep -Milliseconds 500
              $gui.Refresh()
              if ($gui.HasExited) { break }
            }
            # Query UI Automation only AFTER -exec has finished creating the Ribbon.
            # Earlier inspection raced against QCAD postInit and produced false negatives.
            # Inspect the real installed window using Windows UI Automation.
            # Missing Qt accessibility support is NOT_TESTED, never a fabricated PASS.
            try {
              Add-Type -AssemblyName UIAutomationClient -ErrorAction Stop
              Add-Type -AssemblyName UIAutomationTypes -ErrorAction Stop
              $root = [System.Windows.Automation.AutomationElement]::FromHandle($gui.MainWindowHandle)
              if ($null -eq $root) { throw "UIA root element unavailable" }
              $condition = [System.Windows.Automation.PropertyCondition]::new(
                [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                [System.Windows.Automation.ControlType]::TabItem)
              $items = $root.FindAll([System.Windows.Automation.TreeScope]::Descendants, $condition)
              for ($itemIndex = 0; $itemIndex -lt $items.Count; $itemIndex++) {
                $tabNames += [string]$items.Item($itemIndex).Current.Name
              }
              $expectedTabs = @("Trang chủ", "Chèn", "Ghi chú", "Hiển thị", "Quản lý", "Xuất bản")
              $matchingTabs = @($expectedTabs | Where-Object { $tabNames -contains $_ })
              if ($matchingTabs.Count -eq $expectedTabs.Count) {
                $uiaResult = "PASS"
                $uiaDetail = "Six Vietnamese Ribbon tabs exposed through native Windows UIA"
                # Exercise REAL native tab selection instead of accepting tab names
                # as proof of mouse / keyboard interaction. Qt accessibility may
                # omit SelectionItemPattern: record NOT_TESTED in that case.
                $targets = @("Chèn", "Trang chủ")
                $supported = $true
                foreach ($targetName in $targets) {
                  $target = $null
                  for ($index = 0; $index -lt $items.Count; $index++) {
                    if ($items.Item($index).Current.Name -eq $targetName) {
                      $target = $items.Item($index)
                      break
                    }
                  }
                  if ($null -eq $target) {
                    $uiaTabInteraction = "FAIL"
                    $uiaTabInteractionDetail = "Native tab not found: $targetName"
                    break
                  }
                  $selection = $null
                  if (-not $target.TryGetCurrentPattern(
                      [System.Windows.Automation.SelectionItemPattern]::Pattern,
                      [ref]$selection)) {
                    $supported = $false
                    $uiaTabInteractionDetail = "Qt did not expose SelectionItemPattern for $targetName"
                    break
                  }
                  try {
                    $selection.Select()
                    $selected = $false
                    for ($poll = 0; $poll -lt 10; $poll++) {
                      Start-Sleep -Milliseconds 200
                      if ($selection.Current.IsSelected) { $selected = $true; break }
                    }
                    if (-not $selected) {
                      $uiaTabInteraction = "FAIL"
                      $uiaTabInteractionDetail = "UIA Select() did not activate $targetName"
                      break
                    }
                  } catch {
                    $uiaTabInteraction = "FAIL"
                    $uiaTabInteractionDetail = "Native UIA tab selection threw for ${targetName}: $($_.Exception.Message)"
                    break
                  }
                }
                if ($supported -and $uiaTabInteraction -ne "FAIL") {
                  $uiaTabInteraction = "PASS"
                  $uiaTabInteractionDetail = "UIA selected Insert and restored Home using native SelectionItemPattern"
                }
                # Exercise the installed Qt language control through UIA InvokePattern.
                # Missing UIA exposure is NOT_TESTED; a failed invocation is FAIL.
                $buttons = $root.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                  [System.Windows.Automation.PropertyCondition]::new(
                    [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                    [System.Windows.Automation.ControlType]::Button))
                $languageControl = $null
                for ($bi = 0; $bi -lt $buttons.Count; $bi++) {
                  $candidate = $buttons.Item($bi)
                  if ([string]$candidate.Current.AutomationId -eq "IMSATCADRibbonLanguageSwitch" -or
                      [string]$candidate.Current.Name -match '(?i)Switch to English|^English$') {
                    $languageControl = $candidate
                    break
                  }
                }
                if ($null -eq $languageControl) {
                  $uiaLanguageDetail = "Native language control is not exposed through UIA"
                } else {
                  $invoker = $null
                  if (-not $languageControl.TryGetCurrentPattern(
                      [System.Windows.Automation.InvokePattern]::Pattern, [ref]$invoker)) {
                    $uiaLanguageDetail = "Native language control lacks UIA InvokePattern"
                  } else {
                    $uiaLanguageInteraction = "FAIL"
                    try {
                      $localeSets = @(
                        @("Home", "Insert", "Annotate", "View", "Manage", "Output"),
                        @("Trang chủ", "Chèn", "Ghi chú", "Hiển thị", "Quản lý", "Xuất bản"))
                      foreach ($localeSet in $localeSets) {
                        $invoker.Invoke()
                        $seen = $false
                        for ($localePoll = 0; $localePoll -lt 15; $localePoll++) {
                          Start-Sleep -Milliseconds 200
                          $localeItems = $root.FindAll([System.Windows.Automation.TreeScope]::Descendants, $condition)
                          $names = @()
                          for ($li = 0; $li -lt $localeItems.Count; $li++) {
                            $names += [string]$localeItems.Item($li).Current.Name
                          }
                          if (@($localeSet | Where-Object { $names -contains $_ }).Count -eq 6) {
                            $seen = $true
                            break
                          }
                        }
                        if (-not $seen) { throw "Language click did not expose expected tabs: $($localeSet -join ', ')" }
                      }
                      $uiaLanguageInteraction = "PASS"
                      $uiaLanguageDetail = "UIA invoked Qt language button twice; English and Vietnamese tabs verified"
                    } catch {
                      $uiaLanguageDetail = "Native language button UIA invocation failed: $($_.Exception.Message)"
                    }
                  }
                }
                # Invoke a real QCAD drawing action from the installed Ribbon.
                # A successful click proves Qt dispatch and process survival, NOT
                # that any geometry was drawn or a DXF was saved.
                # Re-select Home after language changes: Qt exposes only the
                # active tab's controls in the Windows accessibility tree.
                $homeTabs = $root.FindAll([System.Windows.Automation.TreeScope]::Descendants, $condition)
                for ($hi = 0; $hi -lt $homeTabs.Count; $hi++) {
                  if ([string]$homeTabs.Item($hi).Current.Name -ne "Trang chủ") { continue }
                  $homeSelection = $null
                  if ($homeTabs.Item($hi).TryGetCurrentPattern(
                      [System.Windows.Automation.SelectionItemPattern]::Pattern, [ref]$homeSelection)) {
                    $homeSelection.Select()
                    Start-Sleep -Milliseconds 300
                  }
                  break
                }
                # Qt versions do not always map QObject.objectName to the UIA
                # AutomationId of QAction-backed QToolButton controls. Match
                # both the stable ID and the accessible localized action name.
                # Refresh the collection after switching tabs/languages.
                $lineControl = $null
                $lineId = "IMSATCADRibbonAction_scripts_Draw_Line_Line2P_Line2P_js"
                $freshButtons = $root.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                  [System.Windows.Automation.PropertyCondition]::new(
                    [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                    [System.Windows.Automation.ControlType]::Button))
                $visibleButtonNames = @()
                for ($ci = 0; $ci -lt $freshButtons.Count; $ci++) {
                  $candidate = $freshButtons.Item($ci)
                  $candidateId = [string]$candidate.Current.AutomationId
                  $candidateName = [string]$candidate.Current.Name
                  if ($candidateName) { $visibleButtonNames += $candidateName }
                  if ($candidateId -eq $lineId -or
                      $candidateName -match '(?i)^(IMSAT CAD:\s*)?(Đường thẳng|Line)(\s*\(|$)') {
                    $lineControl = $candidate
                    break
                  }
                }
                if ($null -eq $lineControl) {
                  # Some Qt accessibility backends classify QToolButton as
                  # Custom rather than Button. Search the live UIA tree once.
                  $allControls = $root.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                    [System.Windows.Automation.Condition]::TrueCondition)
                  for ($ci = 0; $ci -lt $allControls.Count; $ci++) {
                    $candidate = $allControls.Item($ci)
                    $candidateId = [string]$candidate.Current.AutomationId
                    $candidateName = [string]$candidate.Current.Name
                    if ($candidateId -eq $lineId -or
                        $candidateName -match '(?i)^(IMSAT CAD:\s*)?(Đường thẳng|Line)(\s*\(|$)') {
                      $lineControl = $candidate
                      break
                    }
                  }
                }
                if ($null -eq $lineControl) {
                  $sample = ($visibleButtonNames | Select-Object -First 15) -join ' | '
                  $uiaCadDetail = "LINE Ribbon control not exposed through UIA; visible buttons: $sample"
                } else {
                  $lineInvoker = $null
                  if (-not $lineControl.TryGetCurrentPattern(
                      [System.Windows.Automation.InvokePattern]::Pattern, [ref]$lineInvoker)) {
                    $uiaCadDetail = "LINE Ribbon control found but lacks native InvokePattern"
                  } else {
                    try {
                      $lineInvoker.Invoke()
                      Start-Sleep -Milliseconds 500
                      $gui.Refresh()
                      if ($gui.HasExited) { throw "Native CAD process exited after LINE invocation" }
                      $uiaCadAction = "PASS"
                      $uiaCadDetail = "Native LINE Ribbon action invoked; geometry and DXF persistence NOT_TESTED"
                    } catch {
                      $uiaCadAction = "FAIL"
                      $uiaCadDetail = "Native LINE Ribbon invocation failed: $($_.Exception.Message)"
                    }
                  }
                }
              } else {
                $uiaDetail = "Expected 6 IMSAT tabs; observed $($matchingTabs.Count) through UIA"
              }
            } catch {
              $uiaDetail = "UIA inspection unavailable: $($_.Exception.Message)"
            }
            if (-not (Test-Path $probeFile)) {
              Write-Warning "Native Ribbon probe did not finish before GUI exit or timeout"
              Write-Host "GUI diagnostic window title: $windowTitle"
              foreach ($diagnosticPath in @($guiStdout, $guiStderr)) {
                if (Test-Path $diagnosticPath) {
                  Write-Host "Last 60 lines from $diagnosticPath"
                  Get-Content $diagnosticPath -Tail 60 -ErrorAction SilentlyContinue
                }
              }
            }
          } finally {
            if (-not $gui.HasExited) { Stop-Process -Id $gui.Id -Force -ErrorAction SilentlyContinue }
            $null = $gui.WaitForExit(5000)
          }
          $probeState = "NOT_TESTED"
          if (Test-Path $probeFile) {
            Copy-Item $probeFile "native-ribbon-probe.txt" -Force
            $probeLines = @(Get-Content $probeFile)
            $probeState = if ($probeLines -contains "Status=PASS") { "PASS" } else { "FAIL" }
          } else {
            "Status=NOT_TESTED" | Set-Content "native-ribbon-probe.txt" -Encoding UTF8
            "Failure=Native -exec probe produced no evidence" | Add-Content "native-ribbon-probe.txt"
            "JavaScriptRuntimePreflight=PASS" | Add-Content "native-ribbon-probe.txt"
            "ProbeScript=$probeScript" | Add-Content "native-ribbon-probe.txt"
          }
          Write-Host "Native installed Ribbon probe: $probeState"
          Write-Host "Native UIA tab interaction: $uiaTabInteraction ($uiaTabInteractionDetail)"
          Write-Host "Native UIA language interaction: $uiaLanguageInteraction ($uiaLanguageDetail)"
          Write-Host "Native UIA LINE action invocation: $uiaCadAction ($uiaCadDetail)"
          Get-Content "native-ribbon-probe.txt" | Select-Object -First 12
          @(
            "InstalledGUIRibbonTabsUIA=$uiaResult",
            "UIADetail=$uiaDetail",
            "RibbonTabInteraction=$uiaTabInteraction",
            "RibbonTabInteractionDetail=$uiaTabInteractionDetail",
            "RibbonLanguageInteraction=$uiaLanguageInteraction",
            "RibbonLanguageInteractionDetail=$uiaLanguageDetail",
            "UIATabNames=$($tabNames -join ' | ')",
            "GUICommandClickTests=$uiaCadAction",
            "GUICommandClickDetail=$uiaCadDetail",
            "CADGeometryAndDXFPersistence=NOT_TESTED"
          ) | Set-Content "native-gui-uia.txt" -Encoding UTF8
          @(
            "Installed GUI window creation: PASS",
            "WindowTitle=$windowTitle",
            "WindowTitleContainsIMSAT=" + [bool]($windowTitle -match "IMSAT"),
            "WindowTitleContainsQCAD=" + [bool]($windowTitle -match "QCAD")
          ) | Set-Content "native-gui-startup.txt" -Encoding UTF8
          # GUI and headless output are independent evidence streams.
          # Prior builds inspected headless output only, so interactive Ribbon
          # initialization failures were invisible to the CI diagnostic report.
          $headlessOutput = ((Get-Content $stdout -Raw -ErrorAction SilentlyContinue) + "`n" + (Get-Content $stderr -Raw -ErrorAction SilentlyContinue))
          $guiOutput = ((Get-Content $guiStdout -Raw -ErrorAction SilentlyContinue) + "`n" + (Get-Content $guiStderr -Raw -ErrorAction SilentlyContinue))
          $guiOutput | Set-Content "native-gui-startup-output.txt" -Encoding UTF8
          $headlessOutput | Set-Content "native-startup-output.txt" -Encoding UTF8
          $ribbonDiagnostics = @(
            "RibbonInitializationInHeadlessLog=" + [bool]($headlessOutput -match 'IMSAT CAD Ribbon initialized:'),
            "RibbonInitializationInGuiLog=" + [bool]($guiOutput -match 'IMSAT CAD Ribbon initialized:'),
            "AliasInitializationInGuiLog=" + [bool]($guiOutput -match 'IMSAT CAD: [0-9]+/[0-9]+ aliases'),
            "RibbonBlockedInGuiLog=" + [bool]($guiOutput -match 'IMSAT CAD RIBBON BLOCKED'),
            "RibbonTabsObservedThroughUIA=$uiaResult",
            "InstalledNativeRibbonProbe=$probeState"
          )
          $ribbonDiagnostics | Set-Content "native-ribbon-diagnostics.txt" -Encoding UTF8
          Write-Host ($ribbonDiagnostics -join "; ")
          if ($guiOutput -match 'IMSAT CAD RIBBON BLOCKED') {
            throw "Native CAD GUI reported Ribbon initialization failure; inspect native-gui-startup-output.txt"
          }
          $ribbonLogObserved = [bool]($guiOutput -match 'IMSAT CAD Ribbon initialized:')
          $ribbonAudit = @(
            "GuiRibbonInitializationObserved=$ribbonLogObserved",
            "InstalledGuiWindowCreated=$windowFound",
            "RibbonTabAccessibility=$uiaResult",
            "InteractiveRibbonTabSwitching=$uiaTabInteraction",
            "InteractiveRibbonLanguageSwitching=$uiaLanguageInteraction",
            "InteractiveNativeActionInvocation=$uiaCadAction",
            "InteractiveNativeActionDetail=$uiaCadDetail",
            "NativeRibbonProbe=$probeState",
            "RibbonAcceptance=NOT_READY"
          )
          $ribbonAudit | Set-Content "native-ribbon-acceptance.txt" -Encoding UTF8
          # This is a diagnostic report, not a substitute for Windows GUI QA.
          # Verify that all six expected tabs are defined in the packaged add-on.
          $installedAddon = Join-Path $destination "scripts/IMSATCAD/IMSATCAD.js"
          $stagedAddon = Join-Path "native/qcad" "scripts/IMSATCAD/IMSATCAD.js"
          $addonPath = if (Test-Path $installedAddon) { $installedAddon } elseif (Test-Path $stagedAddon) { $stagedAddon } else { $null }
          if (-not $addonPath) { throw "IMSAT CAD native Ribbon add-on missing from staging and installation" }
          $addonSource = Get-Content $addonPath -Raw
          foreach ($tab in @("Home", "Insert", "Annotate", "View", "Manage", "Output")) {
            if ($addonSource -notmatch ('"' + $tab + '"')) { throw "IMSAT CAD Ribbon tab missing: $tab" }
          }
          "SixRibbonTabDefinitions=PASS" | Add-Content "native-ribbon-acceptance.txt"
          "AddonSourcePath=$addonPath" | Add-Content "native-ribbon-acceptance.txt"

          # Record real installed binary identity. Copying qcad.exe under a new
          # filename is not a completed IMSAT-branded native application.
          $installedInfo = (Get-Item $installedExe).VersionInfo
          $identity = @(
            "Executable=$($installedExe)",
            "ProductName=$($installedInfo.ProductName)",
            "FileDescription=$($installedInfo.FileDescription)",
            "OriginalFilename=$($installedInfo.OriginalFilename)",
            "CompanyName=$($installedInfo.CompanyName)",
            "GUIWindowCreated=$windowFound",
            "RibbonTabsInteractivelyVerified=$uiaTabInteraction",
            "RibbonLanguageInteractivelyVerified=$uiaLanguageInteraction",
            "NativeCommandClickTests=$uiaCadAction",
            "BrandingGate=NOT_READY"
          )
          # The resource patch is only meaningful if the INSTALLED binary
          # exposes the branded VERSIONINFO. Fail closed on upstream defaults.
          $brandingErrors = @()
          if ($installedInfo.ProductName -cne "IMSAT CAD") {
            $brandingErrors += "ProductName=$($installedInfo.ProductName)"
          }
          if ($installedInfo.OriginalFilename -cne "IMSATCAD.exe") {
            $brandingErrors += "OriginalFilename=$($installedInfo.OriginalFilename)"
          }
          if ($installedInfo.FileDescription -notlike "IMSAT CAD*") {
            $brandingErrors += "FileDescription=$($installedInfo.FileDescription)"
          }
          $brandingGate = if ($brandingErrors.Count -eq 0) { "PASS" } else { "FAIL" }
          $identity = @($identity | Where-Object { $_ -notmatch '^BrandingGate=' })
          $identity += "BrandingGate=$brandingGate"
          $identity += "BrandingErrors=$($brandingErrors -join ' | ')"
          $identity | Set-Content "native-branding-audit.txt" -Encoding UTF8
          Write-Host "Installed native executable VERSIONINFO: $brandingGate"
          if ($brandingGate -eq "FAIL") {
            throw "Installed IMSAT CAD executable identity mismatch: $($brandingErrors -join '; ')"
          }

                    $startupOutput = ((Get-Content $stdout -Raw -ErrorAction SilentlyContinue) + "`n" + (Get-Content $stderr -Raw -ErrorAction SilentlyContinue))
          if ($startupOutput -match '(?i)Cannot load library.*qcadjsapi|No script handler found|Plugin loader reported error') {
            throw "Installed CAD JavaScript plugin failed to load: $startupOutput"
          }
          "Installed executable headless launch: PASS" | Set-Content "native-installed-startup.txt"
          $uninstaller = Join-Path $destination "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Native CAD uninstaller missing" }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Native uninstaller exited with $($uninstall.ExitCode)" }
          "Native installer: PASS" | Set-Content "native-install-smoke.txt"
          "Native uninstaller: PASS" | Add-Content "native-install-smoke.txt"
          "GUI Ribbon tab interaction: $uiaTabInteraction" | Add-Content "native-install-smoke.txt"
          "GUI Ribbon language interaction: $uiaLanguageInteraction" | Add-Content "native-install-smoke.txt"
          "GUI LINE Ribbon invocation: $uiaCadAction" | Add-Content "native-install-smoke.txt"
          "GUI CAD geometry and DXF persistence: NOT_TESTED" | Add-Content "native-install-smoke.txt"
          if ($probeState -ne "PASS") {
            throw "Native installed Ribbon probe $probeState; inspect native-ribbon-probe.txt and native-gui-startup-output.txt"
          }
          if ($uiaTabInteraction -eq "FAIL") {
            throw "Native UIA Ribbon tab selection failed; inspect native-gui-uia.txt"
          }
          if ($uiaLanguageInteraction -eq "FAIL") {
            throw "Native UIA Ribbon language interaction failed; inspect native-gui-uia.txt"
          }
          if ($uiaCadAction -eq "FAIL") {
            throw "Native LINE Ribbon invocation failed; inspect native-gui-uia.txt"
          }
      # Upload diagnostics even when compilation, installation, or GUI smoke fails.
      # Without always(), the logs needed to fix a failed Windows build are lost.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imsat-cad-native-qcad-build-evidence
          path: |
            imsat-cad-native-windows-build.zip
            IMSAT-CAD-V1.0-Setup.exe
            native-installer-sha256.txt
            native-install-smoke.txt
            native-installed-startup.txt
            native-gui-startup.txt
            native-gui-uia.txt
            native-gui-startup-output.txt
            native-branding-audit.txt
            native-executable-origin.txt
            native-ribbon-probe.txt
            native-ribbon-diagnostics.txt
            native-ribbon-acceptance.txt
            native-startup-output.txt
            native-js-runtime-audit.txt
            native-js-runtime-output.txt
            native-commit-report.txt
            native-qt-dependencies.txt
            native-plugin-dependencies.txt
            native-headless-smoke.txt
            native-package-manifest.csv
            native/qcad/release/*.exe
            native/qcad/release/*.dll
            native/qcad/release/platforms/*.dll
            native/qcad/plugins/*qcadjsapi*.dll
          retention-days: 7
