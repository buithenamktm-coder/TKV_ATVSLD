name: IMSAT ROAD Core
on:
  push:
    branches: [imsat-road-v1.0]
    paths:
      - "tools/IMSAT_ROAD/**"
      - ".github/workflows/imsat-road-core.yml"
      - "tools/MiningVolume_HSNext/v0.9/src/MiningVolume.Core/**"
  workflow_dispatch:

jobs:
  core-smoke:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore road smoke project
        run: dotnet restore tools/IMSAT_ROAD/tests/IMSAT.Road.Smoke/IMSAT.Road.Smoke.csproj
      - name: Run road core smoke (Windows .NET Framework 4.8)
        run: dotnet run --project tools/IMSAT_ROAD/tests/IMSAT.Road.Smoke/IMSAT.Road.Smoke.csproj --configuration Release --no-restore
