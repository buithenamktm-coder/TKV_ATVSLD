name: Build MiningVolume AutoCAD 2023

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/MiningVolume_HSNext/v0.9/**'
      - '.github/workflows/build-miningvolume-autocad2023.yml'
  push:
    paths:
      - 'tools/MiningVolume_HSNext/v0.9/**'
      - '.github/workflows/build-miningvolume-autocad2023.yml'

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read

    env:
      MV_ROOT: tools/MiningVolume_HSNext/v0.9
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source checkout
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) {
            throw "Checkout/source mismatch. Expected=$env:SOURCE_SHA Actual=$actual"
          }
          "CHECKED_OUT_SHA=$actual" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Exact source checkout: $actual"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Run independent QA
        shell: pwsh
        run: |
          Set-Location $env:MV_ROOT
          python -m pip install --disable-pip-version-check pytest shapely
          python -m pytest -q tests/reference

      - name: Restore .NET Framework solution
        shell: pwsh
        run: |
          Set-Location $env:MV_ROOT
          dotnet restore MiningVolume.HSNext.sln -p:UseAutoCADNuGet=true

      - name: Build AutoCAD 2023 add-in
        shell: pwsh
        run: |
          Set-Location $env:MV_ROOT
          dotnet build MiningVolume.HSNext.sln -c Release --no-restore -p:UseAutoCADNuGet=true

      - name: Assemble prebuilt bundle
        shell: pwsh
        run: |
          Set-Location $env:MV_ROOT
          $out = 'bundle/MiningVolume2023.bundle/Contents/Windows'
          New-Item -ItemType Directory -Force $out | Out-Null
          Remove-Item "$out/*" -Force -ErrorAction SilentlyContinue
          Copy-Item 'src/MiningVolume.Plugin2023/bin/Release/net48/MiningVolume2023.dll' $out
          Copy-Item 'src/MiningVolume.Core/bin/Release/net48/MiningVolume.Core.dll' $out
          Copy-Item 'src/MiningVolume.Surface/bin/Release/net48/MiningVolume.Surface.dll' $out
          Copy-Item 'src/MiningVolume.Cad2023/bin/Release/net48/MiningVolume.Cad2023.dll' $out
          New-Item -ItemType Directory -Force "$out/Assets" | Out-Null
          Copy-Item 'src/MiningVolume.Plugin2023/Assets/imsat_logo_64.png' "$out/Assets/imsat_logo_64.png"

      - name: Verify release bundle policy
        shell: pwsh
        run: |
          Set-Location $env:MV_ROOT
          ./release/verify_release.ps1

      - name: Parse AutoCAD runtime verifier
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:MV_ROOT 'release/verify_autocad2023_runtime.ps1'),
            [ref]$tokens,
            [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Create installer payload
        shell: pwsh
        run: |
          Set-Location $env:MV_ROOT
          Remove-Item installer/payload.zip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path bundle -DestinationPath installer/payload.zip -CompressionLevel Optimal

      - name: Verify installer source
        shell: pwsh
        run: |
          Set-Location "$env:MV_ROOT/installer"
          $env:GOOS='windows'
          $env:GOARCH='amd64'
          $env:CGO_ENABLED='0'
          go vet main.go

      - name: Build native Windows installer
        shell: pwsh
        run: |
          Set-Location "$env:MV_ROOT/installer"
          New-Item -ItemType Directory -Force ../dist | Out-Null
          $env:GOOS='windows'
          $env:GOARCH='amd64'
          $env:CGO_ENABLED='0'

          # Embed the official IMSAT icon into the Setup executable.
          go install github.com/akavel/rsrc@latest
          $rsrc = Join-Path ((go env GOPATH).Trim()) 'bin/rsrc.exe'
          if (-not (Test-Path $rsrc)) { throw "Không tìm thấy rsrc.exe sau khi cài." }
          & $rsrc -ico imsat.ico -arch amd64 -o rsrc_windows_amd64.syso
          if ($LASTEXITCODE -ne 0) { throw "Không nhúng được icon IMSAT vào Setup." }

          go build -trimpath -ldflags '-s -w -H=windowsgui' -o ../dist/MiningVolume_HSNext_AutoCAD2023_Setup_v0.10.4_PRE_RELEASE.exe main.go
          if ($LASTEXITCODE -ne 0) { throw "Build Setup thất bại." }
          Remove-Item rsrc_windows_amd64.syso -Force -ErrorAction SilentlyContinue

      - name: Create checksums and source archive
        shell: pwsh
        run: |
          Set-Location $env:MV_ROOT
          $setup = 'dist/MiningVolume_HSNext_AutoCAD2023_Setup_v0.10.4_PRE_RELEASE.exe'
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "SHA256  $hash  $(Split-Path $setup -Leaf)" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          @(
            'MiningVolume HS-Next v0.10.4 - BUILD VERIFICATION'
            "Source commit: $env:SOURCE_SHA"
            "Checked out commit: $env:CHECKED_OUT_SHA"
            "Workflow commit: $env:GITHUB_SHA"
            "Workflow run: $env:GITHUB_RUN_ID"
            'Windows CI reference/static tests: PASS'
            'AutoCAD 2023 API compile: PASS'
            'Compile errors: 0'
            'Release bundle policy: PASS'
            'Installer go vet: PASS'
            'Native Windows installer build: PASS'
            'Release status: PRE-RELEASE ONLY - AutoCAD 2023 runtime not verified'
            "Setup SHA256: $hash"
            'AutoCAD 2023 host runtime self-test: NOT EXECUTED ON GITHUB-HOSTED RUNNER'
            'Runtime gate: Setup runs MVSELFTEST in AutoCAD 2023 and rolls back unless Status=PASS.'
          ) | Set-Content -Encoding utf8 dist/BUILD_VERIFICATION.txt
          @(
            'MININGVOLUME HS-NEXT v0.10.4 - PRE-RELEASE'
            'This artifact was built on GitHub-hosted Windows CI.'
            'AutoCAD 2023 host runtime MVSELFTEST has NOT been executed for this artifact.'
            'Do not treat this package as the final release.'
            'The final artifact is created only by the AutoCAD 2023 runtime workflow after Status=PASS.'
          ) | Set-Content -Encoding utf8 dist/PRE_RELEASE_NOTICE.txt
          $sourceZip = Join-Path $env:GITHUB_WORKSPACE "$env:MV_ROOT/dist/MiningVolume_HSNext_Source_v0.10.4.zip"
          Remove-Item $sourceZip -Force -ErrorAction SilentlyContinue
          Push-Location $env:GITHUB_WORKSPACE
          try {
            git archive --format=zip --prefix=MiningVolume_HSNext_v0.10.4/ -o $sourceZip HEAD tools/MiningVolume_HSNext/v0.9
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $sourceZip)) {
              throw 'Không tạo được source archive sạch từ Git HEAD.'
            }
          }
          finally {
            Pop-Location
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($sourceZip)
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName.Replace('\','/') })
            $requiredSourceSuffix = @(
              '/installer/main.go',
              '/tests/reference/test_v104_release_gate_static.py',
              '/release/verify_autocad2023_runtime.ps1',
              '/src/MiningVolume.Plugin2023/Services/SelfTestService.cs'
            )
            foreach ($suffix in $requiredSourceSuffix) {
              if (-not ($names | Where-Object { $_.EndsWith($suffix, [StringComparison]::OrdinalIgnoreCase) })) {
                throw "Source archive thiếu file bắt buộc có hậu tố: $suffix"
              }
            }
            $generated = @($names | Where-Object {
              $_ -match '/(?:bin|obj)/' -or $_ -match '/installer/payload\.zip$'
            })
            if ($generated.Count -gt 0) {
              throw ('Source archive chứa build output không được phép: ' + ($generated -join '; '))
            }
          }
          finally {
            $zip.Dispose()
          }
          Get-Content dist/BUILD_VERIFICATION.txt

      - name: Upload pre-release candidate
        uses: actions/upload-artifact@v4
        with:
          name: MiningVolume-HSNext-AutoCAD2023-v0.10.4-PRE-RELEASE
          if-no-files-found: error
          path: |
            tools/MiningVolume_HSNext/v0.9/dist/MiningVolume_HSNext_AutoCAD2023_Setup_v0.10.4_PRE_RELEASE.exe
            tools/MiningVolume_HSNext/v0.9/dist/MiningVolume_HSNext_Source_v0.10.4.zip
            tools/MiningVolume_HSNext/v0.9/dist/PRE_RELEASE_NOTICE.txt
            tools/MiningVolume_HSNext/v0.9/dist/SHA256SUMS.txt
            tools/MiningVolume_HSNext/v0.9/dist/BUILD_VERIFICATION.txt
            tools/MiningVolume_HSNext/v0.9/QA_REPORT.md
            tools/MiningVolume_HSNext/v0.9/bundle/MiningVolume2023.bundle/**
