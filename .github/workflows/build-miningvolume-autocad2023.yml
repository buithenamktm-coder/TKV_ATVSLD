name: Build MiningVolume AutoCAD 2023

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/MiningVolume_HSNext/v0.10/**'
      - '.github/workflows/build-miningvolume-autocad2023.yml'
  push:
    paths:
      - 'tools/MiningVolume_HSNext/v0.10/**'
      - '.github/workflows/build-miningvolume-autocad2023.yml'

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read

    env:
      MV_ROOT: tools/MiningVolume_HSNext/v0.10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Run independent QA
        shell: pwsh
        run: |
          Set-Location $env:MV_ROOT
          python -m pip install --disable-pip-version-check pytest shapely
          python -m pytest -q tests/reference

      - name: Restore .NET Framework solution
        shell: pwsh
        run: |
          Set-Location $env:MV_ROOT
          dotnet restore MiningVolume.HSNext.sln -p:UseAutoCADNuGet=true

      - name: Build AutoCAD 2023 add-in
        shell: pwsh
        run: |
          Set-Location $env:MV_ROOT
          dotnet build MiningVolume.HSNext.sln -c Release --no-restore -p:UseAutoCADNuGet=true

      - name: Assemble prebuilt bundle
        shell: pwsh
        run: |
          Set-Location $env:MV_ROOT
          $out = 'bundle/MiningVolume2023.bundle/Contents/Windows'
          New-Item -ItemType Directory -Force $out | Out-Null
          Remove-Item "$out/*" -Force -ErrorAction SilentlyContinue
          Copy-Item 'src/MiningVolume.Plugin2023/bin/Release/net48/MiningVolume2023.dll' $out
          Copy-Item 'src/MiningVolume.Core/bin/Release/net48/MiningVolume.Core.dll' $out
          Copy-Item 'src/MiningVolume.Surface/bin/Release/net48/MiningVolume.Surface.dll' $out
          Copy-Item 'src/MiningVolume.Cad2023/bin/Release/net48/MiningVolume.Cad2023.dll' $out

      - name: Verify release bundle policy
        shell: pwsh
        run: |
          Set-Location $env:MV_ROOT
          ./release/verify_release.ps1

      - name: Create installer payload
        shell: pwsh
        run: |
          Set-Location $env:MV_ROOT
          Remove-Item installer/payload.zip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path bundle -DestinationPath installer/payload.zip -CompressionLevel Optimal

      - name: Build native Windows installer
        shell: pwsh
        run: |
          Set-Location "$env:MV_ROOT/installer"
          New-Item -ItemType Directory -Force ../dist | Out-Null
          $env:GOOS='windows'
          $env:GOARCH='amd64'
          $env:CGO_ENABLED='0'
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o ../dist/MiningVolume_HSNext_AutoCAD2023_Setup_v0.10.exe main.go

      - name: Create checksums and source archive
        shell: pwsh
        run: |
          Set-Location $env:MV_ROOT
          $setup = 'dist/MiningVolume_HSNext_AutoCAD2023_Setup_v0.10.exe'
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "SHA256  $hash  $(Split-Path $setup -Leaf)" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Compress-Archive -Path src,bundle,release,README.md,QA_REPORT.md,MiningVolume.HSNext.sln -DestinationPath dist/MiningVolume_HSNext_Source_v0.10.zip -CompressionLevel Optimal

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: MiningVolume-HSNext-AutoCAD2023-v0.10
          if-no-files-found: error
          path: |
            tools/MiningVolume_HSNext/v0.10/dist/MiningVolume_HSNext_AutoCAD2023_Setup_v0.10.exe
            tools/MiningVolume_HSNext/v0.10/dist/MiningVolume_HSNext_Source_v0.10.zip
            tools/MiningVolume_HSNext/v0.10/dist/SHA256SUMS.txt
            tools/MiningVolume_HSNext/v0.10/bundle/MiningVolume2023.bundle/**
