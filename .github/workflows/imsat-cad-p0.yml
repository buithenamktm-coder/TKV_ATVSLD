name: IMSAT CAD P0 DXF Regression

on:
  push:
    branches: [imsat-cad-foundation]
    paths:
      - "tools/IMSAT_CAD/**"
      - ".github/workflows/imsat-cad-p0.yml"
  pull_request:
    paths:
      - "tools/IMSAT_CAD/**"
      - ".github/workflows/imsat-cad-p0.yml"

jobs:
  dxf-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: tools/IMSAT_CAD
        run: python -m pip install -r requirements.txt
      - name: DXF regression tests
        working-directory: tools/IMSAT_CAD
        run: python -m pytest -q tests
