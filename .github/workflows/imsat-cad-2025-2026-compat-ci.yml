name: IMSAT VOLUME - AutoCAD 2021-2026 compatibility compile (NOT RELEASE)

on:
  workflow_dispatch:
  push:
    branches:
      - miningvolume-v2-chatgpt-p0-continuation
    paths:
      - 'tools/MiningVolume_HSNext/v0.9/compat/**'
      - 'tools/MiningVolume_HSNext/v0.9/src/**/*.csproj'
      - 'tools/MiningVolume_HSNext/v0.9/src/**/*.cs'
      - '.github/workflows/imsat-cad-2025-2026-compat-ci.yml'

jobs:
  compatibility:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        flavor:
          - ACAD2021_NET48
          - ACAD2022_NET48
          - ACAD2024_NET48
          - ACAD2025_NET8
          - ACAD2025_NET10
          - ACAD2026_NET8
          - ACAD2026_NET10
    defaults:
      run:
        working-directory: tools/MiningVolume_HSNext/v0.9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Verify compatibility build manifest before compiling
        shell: pwsh
        run: |
          python -m unittest discover -s compat -p 'test_*.py'
      - name: Cross-compile candidate against version-matched Autodesk API
        shell: pwsh
        run: |
          ./compat/build_compat.ps1 -Flavor '${{ matrix.flavor }}' -NuGetReferences
      - name: Upload compile-only diagnostics (never a signed installer)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: IMSAT-COMPAT-${{ matrix.flavor }}-COMPILE-ONLY
          path: tools/MiningVolume_HSNext/v0.9/dist/compat/${{ matrix.flavor }}/**
          retention-days: 7
